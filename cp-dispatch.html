let npAttachedDocs = [];

async function scanNewProjectFile() {
  const file = $('npAttachFile')?.files?.[0];
  if (!file) return;
  if (!sampleAI) { toast('AI scanning not available', 'error'); return; }
  $('npAttachZone').hidden = true;
  $('npScanProgress').hidden = false;
  $('npScanText').textContent = 'Preparing document...';
  try {
    let images = [];
    if (file.type === 'application/pdf') {
      $('npScanText').textContent = 'Rendering PDF pages...';
      images = await renderPdfToImages(file);
    } else {
      images = [file];
    }
    const limits = await sampleAI.limits().catch(() => null);
    const canSendImages = !!limits?.images;
    const knownProducts = [];
    for (const sys of Object.values(CATALOG)) {
      for (const products of Object.values(sys.applications)) {
        products.forEach(pr => { if (!knownProducts.includes(pr.name)) knownProducts.push(pr.name); });
      }
    }
    const prompt = `You are reading a commercial document (offer/quotation or invoice, usually in Greek) issued by Cement Plus, a microcement company in Greece.
Read it VERY carefully, line by line: header, customer block, line-item table, totals, payment terms and small print. Copy values exactly as printed (keep Greek text, never translate or invent). If something is not in the document use "" (or 0 / []).

Known product systems: ${Object.keys(CATALOG).join(', ')}
Known products: ${knownProducts.join(', ')}

Return ONLY one JSON object:
{
  "documentType": "offer" or "invoice",
  "documentNumber": "e.g. 307",
  "clientName": "customer name exactly as printed",
  "projectName": "project / site name if printed, else empty",
  "location": "destination / delivery or site address / city as printed",
  "deadline": "YYYY-MM-DD only if an actual delivery or completion DATE is printed, else empty",
  "notes": "delivery time, validity and other conditions, short, as printed",
  "paymentTerms": {
    "terms": "payment terms sentence exactly as printed (e.g. advance %, balance, method)",
    "totalAmount": grand total payable as a number (final amount incl. VAT if shown) or 0,
    "installments": [{"label":"Advance","percent":100,"amount":0,"dueDate":""}]
  },
  "systems": [
    {
      "systemName": "matching name from the known product systems, else a short descriptive name",
      "application": "matching application or empty",
      "area": area in m² as a number if printed, else 0,
      "materials": [{"name":"product name (use the known product name when it matches)","pkg":"pack size, e.g. 20kg, 10lt, 5+1lt, 50m²","quantity":number of packs/units on that line,"unit":"kg | lt | m² | pcs"}]
    }
  ]
}
Rules for materials: only physical products (no labour, transport, discounts, VAT). "quantity" is the number of packs as ordered. If the quantity column is in kg/lt/m² (e.g. 60 kg of a 20kg product) convert it to number of packs (3). Keep EVERY product line; group lines under one system if the document does, otherwise use a single system. Installments: derive from the payment terms (e.g. "100% advance" -> one installment 100%; "50% advance, 50% on delivery" -> two); percent and amount may be 0 if unknown.`;

    $('npScanText').textContent = 'Reading document carefully with AI...';
    const opts = { modelTier: 'complex', cache: false };
    let result;
    if (canSendImages && images.length > 0) {
      result = await sampleAI.json(prompt, { ...opts, images: images.slice(0, limits.images.maxCount || 5) });
    } else if (file.type === 'application/pdf') {
      $('npScanText').textContent = 'Extracting text...';
      const text = await extractPdfText(file);
      if (!text) { toast('Cannot read this PDF', 'error'); resetNpScan(); return; }
      result = await sampleAI.json(prompt + '\n\nDocument text:\n' + text.slice(0, 30000), opts);
    } else {
      toast('Image support not available — try a PDF instead', 'error'); resetNpScan(); return;
    }
    if (!result || typeof result !== 'object' || Array.isArray(result)) { toast('Could not extract data from document', 'warn'); resetNpScan(); return; }
    applyScannedData(result, file);
  } catch (e) {
    const msg = e.code === 'not_granted' ? 'AI scanning permission denied' :
                e.code === 'rate_limited' ? 'Rate limited — try again in a moment' :
                e.code === 'image_rejected' ? 'Image could not be processed — try a different file' :
                e.code === 'invalid_json' ? 'Could not parse document — try a clearer scan' :
                'Scan failed: ' + (e.message || 'unknown error');
    toast(msg, 'error'); resetNpScan();
  }
}

function resetNpScan() {
  if ($('npAttachZone')) $('npAttachZone').hidden = false;
  if ($('npScanProgress')) $('npScanProgress').hidden = true;
  if ($('npAttachFile')) $('npAttachFile').value = '';
}

function applyScannedData(data, file) {
  const docType = String(data.documentType || '').toLowerCase() === 'invoice' ? 'invoice' : 'offer';
  const label = docType === 'invoice' ? 'Invoice' : 'Offer';
  const fill = (id, v) => { const el = $(id); if (el && v && !String(el.value).trim()) el.value = v; };
  const fallbackName = data.documentNumber ? `${label} ${data.documentNumber}` : file.name.replace(/\.[^.]+$/, '');
  fill('projName', String(data.projectName || '').trim() || fallbackName);
  fill('projClient', String(data.clientName || '').trim());
  fill('projLocation', String(data.location || '').trim());
  if (/^\d{4}-\d{2}-\d{2}$/.test(data.deadline || '')) fill('projDeadline', data.deadline);
  fill('projNotes', String(data.notes || '').trim());

  const pay = data.paymentTerms || {};
  const total = parseFloat(pay.totalAmount) || 0;
  fill('payTotal', total || '');
  fill('payTerms', String(pay.terms || '').trim());
  let payFound = !!(total || pay.terms);
  if (Array.isArray(pay.installments) && $('payRows') && $('payRows').children.length === 0) {
    pay.installments.forEach(i => {
      const percent = parseFloat(i.percent) || 0;
      const amount = parseFloat(i.amount) || (total && percent ? Math.round(total * percent) / 100 : 0);
      $('payRows').insertAdjacentHTML('beforeend', payRowHtml({ label: String(i.label || '').trim(), percent: percent || '', amount: amount || '', dueDate: /^\d{4}-\d{2}-\d{2}$/.test(i.dueDate || '') ? i.dueDate : '' }));
      payFound = true;
    });
  }

  const docId = uid();
  let matCount = 0;
  (Array.isArray(data.systems) ? data.systems : []).forEach((sys, n) => {
    const key = Object.keys(CATALOG).find(k => k.toLowerCase() === String(sys.systemName || '').trim().toLowerCase());
    const materials = (Array.isArray(sys.materials) ? sys.materials : []).map(m => ({
      name: String(m.name || '').trim(), pkg: String(m.pkg || '').trim(),
      quantity: parseFloat(m.quantity) || 0, unit: String(m.unit || 'kg').trim()
    })).filter(m => m.name);
    if (!key && materials.length === 0) return;
    const app = key && CATALOG[key].applications[sys.application] ? sys.application : (key ? Object.keys(CATALOG[key].applications)[0] : 'Imported materials');
    const card = { systemName: key || String(sys.systemName || '').trim() || `${label} ${data.documentNumber || ''} items ${n + 1}`.trim(), application: app, area: parseFloat(sys.area) || 0, notes: '', offerDoc: file.name };
    if (materials.length) { card.offerItems = materials; matCount += materials.length; }
    $('systemsList').insertAdjacentHTML('beforeend', systemCardHtml(card, docId));
  });

  npAttachedDocs.push({ id: docId, fileName: file.name, file, docType, matCount, payFound });
  renderAttachedFiles();
  resetNpScan();
  if (matCount === 0) toast('Document read, but no material lines were found — add them manually', 'warn');
  else toast(`Document read — ${matCount} materials${payFound ? ' and payment terms' : ''} filled in`);
}

function renderAttachedFiles() {
  const c = $('npAttachedFiles');
  if (!c) return;
  c.innerHTML = npAttachedDocs.map(d => `
    <div class="attached-file">
      <div class="af-icon">${/\.pdf$/i.test(d.fileName) ? 'PDF' : 'IMG'}</div>
      <div class="af-info">
        <div class="af-name">${escAttr(d.fileName)}</div>

// ========== DOCUMENT PREVIEW ==========
async function loadPdfJs() {
  if (window.pdfjsLib) return;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const blobToDataUrl = blob => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result); r.onerror = reject;
  r.readAsDataURL(blob);
});

async function previewDocument(src, name) {
  $('previewTitle').textContent = name || 'Document';
  $('previewBody').innerHTML = '<div class="scan-progress"><div class="spinner"></div><span>Loading preview...</span></div>';
  $('previewOverlay').classList.add('open');
  try {
    let blob = src;
    if (typeof src === 'string') {
      const r = await fetch(src);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      blob = await r.blob();
    }
    let html = '';
    if (blob.type === 'application/pdf' || /\.pdf$/i.test(name || '')) {
      await loadPdfJs();
      const pdf = await window.pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
      for (let i = 1; i <= Math.min(pdf.numPages, 15); i++) {
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: 1.6 });
        const c = document.createElement('canvas');
        c.width = vp.width; c.height = vp.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        html += `<img class="pv-page" alt="Page ${i}" src="${c.toDataURL('image/jpeg', 0.88)}">`;
      }
      if (pdf.numPages > 15) html += `<div class="form-help">Showing first 15 of ${pdf.numPages} pages.</div>`;
    } else {
      html = `<img class="pv-page" alt="${escAttr(name)}" src="${await blobToDataUrl(blob)}">`;
    }
    $('previewBody').innerHTML = html;
  } catch (e) {
    $('previewBody').innerHTML = `<div class="empty-state"><p>Preview not available (${escAttr(e.message || 'error')}).</p>${typeof src === 'string' ? `<a class="btn btn-secondary btn-sm" href="${escAttr(src)}" target="_blank">Open in new tab</a>` : ''}</div>`;
  }
}

function closePreview() { $('previewOverlay').classList.remove('open'); $('previewBody').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });

const fmtMoney = n => '€' + (Number(n) || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function installmentStatus(i) {
  if (i.paid) return { cls: 'chip-green', text: 'Paid' + (i.paidDate ? ' ' + fmtDate(i.paidDate) : '') };
  if (i.dueDate && i.dueDate < today()) return { cls: 'chip-red', text: 'Overdue' };
  return { cls: 'chip-amber', text: i.dueDate ? 'Due ' + fmtDate(i.dueDate) : 'Pending' };
}

function commitPayment(p, msg) {
  p.updatedAt = new Date().toISOString();
  saveProjectDoc(p);
  if (msg) logActivity(msg + ` — "${p.name}"`);
  renderPayments(p);
}

function renderPayments(p) {
  const pay = p.payment;
  const docs = (p.files || []).filter(f => /^(offer|invoice)$/i.test(f.category || '') && f.url);
  const docsHtml = docs.length ? `<h3 class="mb-8 mt-16">Source Documents</h3>` + docs.map(f => `
    <div class="file-item"><div class="file-icon" style="background:var(--surface-alt)">${(f.name || '').split('.').pop().toUpperCase()}</div>
      <div class="file-info"><div class="file-name">${escAttr(f.name)}</div><div class="file-meta">${escAttr(f.category)} • ${fmtDate(f.uploadedAt)}</div></div>
      <button class="btn btn-secondary btn-sm" onclick="previewFile('${f.id}')">Preview</button></div>`).join('') : '';
  if (!pay) {
    $('tab-payments').innerHTML = `<div class="flex justify-between items-center mb-16"><h3>Payment Terms</h3>
      <button class="btn btn-primary btn-sm" onclick="openPaymentTerms()">Set Payment Terms</button></div>
      <div class="empty-state"><p>No payment terms yet. Attach an offer when creating a project, or set them here.</p></div>${docsHtml}`;
    return;
  }
  const inst = pay.installments || [];
  const total = pay.total || inst.reduce((s, i) => s + (i.amount || 0), 0);
  const paid = inst.filter(i => i.paid).reduce((s, i) => s + (i.amount || 0), 0);
  const pct = total > 0 ? Math.min(100, Math.round(paid / total * 100)) : 0;
  const rows = inst.map(i => {
    const st = installmentStatus(i);
    return `<tr><td><strong>${escAttr(i.label)}</strong></td><td>${i.percent ? i.percent + '%' : '—'}</td><td>${fmtMoney(i.amount)}</td>
      <td><span class="chip ${st.cls}">${st.text}</span></td>
      <td style="white-space:nowrap"><button class="btn btn-secondary btn-sm" onclick="toggleInstallmentPaid('${i.id}')">${i.paid ? 'Undo' : 'Mark Paid'}</button>
        <button class="btn btn-secondary btn-sm" onclick="openInstallment('${i.id}')">Edit</button>
        <button class="remove-btn" title="Delete installment" onclick="deleteInstallment('${i.id}')">✕</button></td></tr>`;
  }).join('');
  $('tab-payments').innerHTML = `
    <div class="flex justify-between items-center mb-16"><h3>Payment Terms</h3>
      <div class="flex gap-8"><button class="btn btn-secondary btn-sm" onclick="openPaymentTerms()">Edit Terms</button>
      <button class="btn btn-danger btn-sm" onclick="deletePaymentTerms()">Delete</button></div></div>
    <div class="pay-kpis">
      <div class="pay-kpi tile-link" role="button" tabindex="0" onclick="openPaymentTerms()" title="Edit terms"><div class="pk-val">${fmtMoney(total)}</div><div class="pk-label">Total</div></div>
      <div class="pay-kpi tile-link" role="button" tabindex="0" onclick="$('payInst').scrollIntoView({behavior:'smooth'})"><div class="pk-val" style="color:var(--green)">${fmtMoney(paid)}</div><div class="pk-label">Paid (${pct}%)</div></div>
      <div class="pay-kpi tile-link" role="button" tabindex="0" onclick="$('payInst').scrollIntoView({behavior:'smooth'})"><div class="pk-val" style="color:var(--red)">${fmtMoney(Math.max(0, total - paid))}</div><div class="pk-label">Outstanding</div></div>
    </div>
    ${pay.terms ? `<div class="pay-terms-box">${escAttr(pay.terms)}</div>` : ''}
    <div class="flex justify-between items-center mb-8" id="payInst"><h3>Installments</h3><button class="btn btn-primary btn-sm" onclick="openInstallment('')">+ Add Installment</button></div>
    ${inst.length ? `<div class="overflow-x"><table><thead><tr><th>Payment</th><th>%</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty-state"><p>No installments. Add one to track payments.</p></div>'}
    ${docsHtml}`;
}

function openInstallment(id) {
  const p = projects[currentProject];
  const i = (p.payment?.installments || []).find(x => x.id === id) || { label: '', percent: '', amount: '', dueDate: '', paid: false };
  openModal(id ? 'Edit Installment' : 'Add Installment', `
    <div class="form-row"><label>Label</label><input type="text" id="inLabel" value="${escAttr(i.label)}" placeholder="e.g., Advance, On delivery"></div>
    <div class="form-grid">
      <div class="form-row"><label>Percent (%)</label><input type="number" id="inPct" value="${i.percent || ''}" min="0" max="100" step="any" oninput="instPctChange()"></div>
      <div class="form-row"><label>Amount (€)</label><input type="number" id="inAmt" value="${i.amount || ''}" min="0" step="any"></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Due Date</label><input type="date" id="inDue" value="${escAttr(i.dueDate)}"></div>
      <div class="form-row"><label>Status</label><select id="inPaid"><option value="0" ${i.paid ? '' : 'selected'}>Pending</option><option value="1" ${i.paid ? 'selected' : ''}>Paid</option></select></div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveInstallment('${id}')">Save</button>`);
}

function instPctChange() {
  const total = projects[currentProject]?.payment?.total || 0;
  const pct = parseFloat($('inPct').value);
  if (total > 0 && !isNaN(pct)) $('inAmt').value = Math.round(total * pct) / 100;
}

function saveInstallment(id) {
  const p = projects[currentProject];
  if (!p.payment) p.payment = { total: 0, terms: '', installments: [] };
  const list = p.payment.installments = p.payment.installments || [];
  const paid = $('inPaid').value === '1';
  const prev = list.find(x => x.id === id);
  const item = {
    id: id || uid(), label: $('inLabel').value.trim() || 'Payment',
    percent: parseFloat($('inPct').value) || 0, amount: parseFloat($('inAmt').value) || 0,
    dueDate: $('inDue').value || '', paid, paidDate: paid ? (prev?.paidDate || today()) : ''
  };
  if (prev) Object.assign(prev, item); else list.push(item);
  closeModal();
  commitPayment(p, (id ? 'edited' : 'added') + ` installment "${item.label}"`);
  toast('Installment saved');
}

function toggleInstallmentPaid(id) {
  const p = projects[currentProject];
  const i = (p.payment?.installments || []).find(x => x.id === id);
  if (!i) return;
  i.paid = !i.paid;
  i.paidDate = i.paid ? today() : '';
  commitPayment(p, `${i.paid ? 'marked paid' : 'unmarked'} installment "${i.label}"`);
}

function deleteInstallment(id) {
  showWarning('Delete Installment', 'Delete this installment?', () => {
    const p = projects[currentProject];
    p.payment.installments = p.payment.installments.filter(x => x.id !== id);
    commitPayment(p, 'deleted an installment');

  if (downloads) {

    catch (e) { if (e.code !== 'declined') toast('Download failed: ' + e.message, 'error'); }
  } else toast('Download not available in this view', 'warn');
}

  const barId = { 'chk-proj':'batchProj','chk-ord':'batchOrd','chk-del':'batchDel','chk-rem':'batchRem','chk-file':'batchFile','chk-note':'batchNote','chk-rec':'batchRec','chk-plan':'batchPlan' }[cls];
  if (barId) updateBatchBar(cls, barId);
}

function syncHeaderCheckbox(cls) {
  const first = document.querySelector('.' + cls);
  if (!first) return;
  const hdr = first.closest('table')?.querySelector('th .list-check');
  if (!hdr) return;
  const boxes = document.querySelectorAll('.' + cls);
  hdr.checked = boxes.length > 0 && [...boxes].every(cb => cb.checked);
}

function updateBatchBar(cls, barId) {
  const bar = $(barId);
  if (!bar) return;
  const count = document.querySelectorAll('.' + cls + ':checked').length;
  bar.classList.toggle('visible', count > 0);
  bar.querySelector('.batch-count').textContent = count + ' selected';
  syncHeaderCheckbox(cls);
}

function selectAllToggle(cls, barId, toggleId) {
  const boxes = document.querySelectorAll('.' + cls);
  const allChecked = boxes.length > 0 && [...boxes].every(cb => cb.checked);
  boxes.forEach(cb => cb.checked = !allChecked);
  updateBatchBar(cls, barId);
  syncHeaderCheckbox(cls);
  updateToggleLabel(cls, toggleId);
}

function updateToggleLabel(cls, toggleId) {
  const el = $(toggleId);
  if (!el) return;
  const boxes = document.querySelectorAll('.' + cls);
  const allChecked = boxes.length > 0 && [...boxes].every(cb => cb.checked);
  el.textContent = allChecked ? 'Deselect All' : 'Select All';
}

// ========== AI CHAT ==========
const CHAT_KEY = 'cpChat';
const CHAT_SUGGESTIONS = [
  'How many kg of NANOFIN 50 VELVET have we delivered since 1 Aug 2026?',
  'Which projects have unpaid or overdue installments?',
  'Which materials are low in stock right now?',
  'How do I record a delivery and what happens to stock?',
  'What is missing in this app that would help my business?'
];
let chatTurns = [];
let chatCtl = null;
let chatBusy = false;
let chatHasTools = false;
let chatLive = null;

const chatStore = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

function initChat() {
  if (!sampleAI) return;
  try {
    const v = JSON.parse(chatStore.get(CHAT_KEY) || '[]');
    if (Array.isArray(v)) chatTurns = v.filter(t => t && (t.role === 'user' || t.role === 'assistant') && typeof t.content === 'string' && t.content);
  } catch (e) {}
  $('chatFab').classList.add('ready');
  sampleAI.limits().then(l => { chatHasTools = !!l?.tools; }).catch(() => { chatHasTools = false; });
  renderChat();
  if (chatStore.get('cpChatOpen') === '1') toggleChat(true);
}

function toggleChat(open) {
  document.body.classList.toggle('chat-open', open);
  chatStore.set('cpChatOpen', open ? '1' : '0');
  if (open) { renderChat(); setTimeout(() => $('chatInput')?.focus(), 250); }
}

function clearChat() {
  if (chatBusy) stopChat();
  chatTurns = [];
  chatStore.set(CHAT_KEY, '[]');
  renderChat();
}

function chatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}
function chatGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function stopChat() { if (chatCtl) chatCtl.abort(); }

function mdInline(s) {
  return escAttr(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function mdLite(src) {
  const lines = String(src || '').split('\n');
  let out = '', i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*\|/.test(ln)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r) || !/-/.test(r)).map(cells);
      if (body.length) out += '<div class="chat-tbl"><table><thead><tr>' + body[0].map(c => `<th>${mdInline(c)}</th>`).join('') + '</tr></thead><tbody>' +
        body.slice(1).map(r => '<tr>' + r.map(c => `<td>${mdInline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
    } else if (/^\s*([-*•])\s+/.test(ln)) {
      out += '<ul>';
      while (i < lines.length && /^\s*([-*•])\s+/.test(lines[i])) { out += `<li>${mdInline(lines[i].replace(/^\s*([-*•])\s+/, ''))}</li>`; i++; }
      out += '</ul>';
    } else if (/^\s*\d+[.)]\s+/.test(ln)) {
      out += '<ol>';
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { out += `<li>${mdInline(lines[i].replace(/^\s*\d+[.)]\s+/, ''))}</li>`; i++; }
      out += '</ol>';
    } else if (!ln.trim()) { i++; }
    else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(\||[-*•]\s|\d+[.)]\s)/.test(lines[i])) { para.push(lines[i]); i++; }
      out += `<p>${mdInline(para.join('\n')).replace(/\n/g, '<br>')}</p>`;
    }
  }
  return out;
}

function renderChat() {
  const body = $('chatBody');
  if (!body) return;
  if (chatTurns.length === 0) {
    body.innerHTML = `<div class="chat-msg assistant"><p>Hi ${escAttr(currentUser)}, I'm Cement Plus AI. I can explain how Cement Plus Daily works, point out what is missing, and answer questions from your live data: sales, deliveries, stock, orders, payments.</p><p>Try one of these:</p></div>
      <div class="chat-sugg">${CHAT_SUGGESTIONS.map((s, i) => `<button onclick="sendChat(CHAT_SUGGESTIONS[${i}])">${escAttr(s)}</button>`).join('')}</div>`;
    return;
  }
  body.innerHTML = chatTurns.map(t => t.role === 'user'
    ? `<div class="chat-msg user">${escAttr(t.content)}</div>`
    : `<div class="chat-msg assistant">${mdLite(t.content)}</div>`).join('');
  body.scrollTop = body.scrollHeight;
}

function setChatUi() {
  $('chatSend').hidden = chatBusy;
  $('chatStop').hidden = !chatBusy;
  $('chatInput').disabled = chatBusy;
}

function chatStatus(text) {
  if (!chatLive) return;
  chatLive.status = text;
  paintLive();
}

function paintLive() {
  if (!chatLive) return;
  chatLive.bubble.innerHTML = (chatLive.text ? mdLite(chatLive.text) : '') + (chatLive.status ? `<span class="chat-status">${escAttr(chatLive.status)}</span>` : '');
  const body = $('chatBody');
  body.scrollTop = body.scrollHeight;
}

const CHAT_ERRORS = {
  not_granted: 'AI access was declined for this app. Allow it when asked, or in your claude.ai settings.',
  sampling_disabled: 'Claude is not available for this account or organization.',
  rate_limited: 'Too many requests or usage limit reached. Wait a moment and try again.',
  session_expired: 'Your session expired. Reload the page and sign in again.',
  prompt_too_large: 'The question plus data was too large. Ask for something narrower (a date range or one material).',
  refused: 'Claude declined to answer that.',
  empty_completion: 'No answer came back. Try rephrasing.',
  upstream_error: 'A temporary connection error occurred. Try again.'
};

async function sendChat(preset) {
  if (chatBusy || !sampleAI) return;
  const input = $('chatInput');
  const text = String(preset != null ? preset : input.value).trim();
  if (!text) return;
  input.value = ''; chatGrow(input);
  chatTurns.push({ role: 'user', content: text });
  renderChat();
  const body = $('chatBody');
  body.insertAdjacentHTML('beforeend', '<div class="chat-msg assistant" id="chatLiveBubble"></div>');
  chatLive = { bubble: $('chatLiveBubble'), text: '', status: 'Thinking…' };
  paintLive();
  chatBusy = true; setChatUi();
  chatCtl = new AbortController();
  try {
    const opts = {
      cache: false,
      signal: chatCtl.signal,
      onText: ({ text: t }) => { chatLive.text = t; chatLive.status = ''; paintLive(); }
    };
    if (chatHasTools) opts.tools = chatToolDefs();
    const res = await sampleAI(buildChatInput(), opts);
    chatTurns.push({ role: 'assistant', content: res.text + (res.truncated ? '\n\n(Answer was cut short — ask for less at a time.)' : '') });
  } catch (e) {
    if (e && e.text) chatTurns.push({ role: 'assistant', content: e.text + '\n\n(Interrupted)' });
    else {
      chatTurns.pop();
      if (e && e.code !== 'cancelled') {
        chatLive.bubble.innerHTML = `<span class="chat-err">${escAttr(CHAT_ERRORS[e.code] || ('Something went wrong: ' + (e.message || e.code || 'unknown error')))}</span>`;
        chatLive = null; chatBusy = false; setChatUi(); input.value = text;
        return;
      }
    }
  }
  chatLive = null; chatBusy = false; setChatUi();
  chatStore.set(CHAT_KEY, JSON.stringify(chatTurns.slice(-30)));
  renderChat();
  $('chatInput').focus();
}

function viewContext() {
  const page = document.querySelector('.page.active')?.id?.replace('page-', '') || 'dashboard';
  let ctx = `[Context: today is ${today()}; user is ${currentUser}; viewing the "${page}" page`;
  if (page === 'project-detail' && projects[currentProject]) ctx += ` for project "${projects[currentProject].name}"`;
  return ctx + ']';
}

function buildChatInput() {
  const enc = new TextEncoder();
  let rules = chatRules();
  if (!chatHasTools) rules += '\n\nLIVE DATA (JSON, because lookup tools are unavailable in this view):\n' + JSON.stringify(chatDigest()).slice(0, 28000);
  let hist = chatTurns.slice(-14).map(t => ({ role: t.role, content: t.content.slice(0, 6000) }));
  while (hist.length > 1 && hist[0].role !== 'user') hist.shift();
  const last = hist.length - 1;
  hist[last] = { role: 'user', content: viewContext() + '\n\n' + hist[last].content };
  const size = () => enc.encode(rules).length + hist.reduce((s, t) => s + enc.encode(t.content).length, 0);
  while (hist.length > 1 && size() > 56000) { hist.shift(); while (hist.length > 1 && hist[0].role !== 'user') hist.shift(); }
  return [{ role: 'user', content: rules }, ...hist];
}

function chatRules() {
  const names = Object.values(projects).map(p => `${p.name} (${p.client || '—'}, ${p.status})`).slice(0, 80).join('; ');
  const sysNames = Object.keys(CATALOG).join(', ');
  return `You are "Cement Plus AI", the built-in assistant of Cement Plus Daily, the project and warehouse management app of Cement Plus (microcement manufacturer/applicator, Larissa, Greece). You are talking to ${currentUser}, usually Alex, the managing director, a mechanical engineer who runs several SMEs: give simple but advanced, clearly stated answers, short by default, with numbers and units. Reply in the language the user writes in (Greek or English). Dates written by the user are Greek style day/month/year (11/8/2026 = 11 August 2026). Today is ${today()}.

HOW TO ANSWER
- For ANY number, total, list or status about projects, deliveries, stock, orders or payments, call the lookup tools; never estimate or invent figures. If a tool returns nothing, say so and mention what you searched.
- "Sold" is ambiguous. Report DELIVERED (physically delivered to projects, dated by delivery date) and CONTRACTED (quantities in project offers, dated by project creation date) separately and say which is which. Amounts are units x pack size (e.g. 3 packs of 20kg = 60 kg).
- Only data entered in the app exists. Say so when a question needs data the app does not hold (e.g. prices, costs, supplier data).
- When asked how something works, explain using the app description below and name the exact page, tab or button. When asked what is missing, give a short prioritized list of concrete gaps and why each matters.
- Never claim you changed anything: you can only read data.

ABOUT THE APP
Left menu: Dashboard (KPIs, alerts, analytics charts), Projects, Stock, Orders, Reminders, Timeline (Gantt of project phases).
Projects list: New Project, table with checkboxes; selecting rows shows a bar with bulk actions (set status, export CSV, delete).
New Project: "Attach Offer or Invoice" lets AI read a PDF/photo and fill client, location, deadline, notes, payment terms and the exact material quantities; each attached file has Preview, Edit and delete. Product systems can also be added manually from the catalog; materials are then calculated from consumption per m2.
Project tabs: Overview (systems, progress), Phases (allocate m2 per system, dates, status), Materials (required units, in stock, delivered, remaining; "Generate Order for Missing"), Payment Terms (total, terms, installments with Paid/Pending/Overdue, mark paid), Deliveries (record a delivery: deducts stock, delivery note CSV, photos, email notification), Files (upload, preview), Production (batches planned > mixing > curing > ready), Notes.
Stock: quantities and minimum levels per material (Update Stock; it can also read ERP stock files with AI). Reconcile with ERP (Stock page): upload ERP stock file(s), see differences vs app stock, apply ERP values per material or in bulk. Orders: supplier orders pending > ordered > received (receiving adds to stock); Reorder Planner (Orders page): per material suggested order = remaining demand of active projects + minimum stock - stock - already ordered, with needed-by date (earliest phase target date or project deadline), lead time and order-by date, plus one-click order creation; AUTO-... orders are created by the auto-reorder check for active-project shortages. Reminders: assign to team members with date/time. Email notifications go to the team through Gmail. Data is shared by the whole team in one database; the header shows who is online.
Catalog (17 product systems): ${sysNames}.
Not in the app today (candidates when asked what is missing): unit prices, costs and margins per material or project; supplier database and supplier prices; a customer database (client is free text); issuing offers/invoices from the app; user roles and permissions; calendar sync; returns and credit notes; stock by batch number or warehouse location; multi-currency (EUR only); reports/export to accounting.

CURRENT PROJECTS: ${names || 'none yet'}.
Counts: ${Object.keys(projects).length} projects, ${Object.keys(deliveries).length} deliveries, ${Object.keys(orders).length} supplier orders, ${Object.keys(stockData).length} stocked materials.`;
}

// ---- lookup tools (read-only, run in the page) ----
const chatNorm = s => String(s == null ? '' : s).toLowerCase().replace(/ς/g, 'σ').normalize('NFD').replace(/[̀-ͯ]/g, '');
const chatMatch = (hay, q) => { const h = chatNorm(hay); return chatNorm(q).split(/\s+/).filter(Boolean).every(t => h.includes(t)); };
const chatRound = n => Math.round((Number(n) || 0) * 100) / 100;
const chatUnit = pkg => (String(pkg || '').match(/(kg|lt|m²)/i) || [, 'units'])[1].toLowerCase();

function chatDate(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return '';
}

function chatAggregate(items, groupBy) {
  const total = { units: 0, amounts: {} };
  const groups = {};
  items.forEach(it => {
    const amt = it.units * pkgSize(it.pkg || ''), u = chatUnit(it.pkg);
    total.units += it.units;
    total.amounts[u] = (total.amounts[u] || 0) + amt;
    if (groupBy && groupBy !== 'none') {
      const k = groupBy === 'project' ? it.project : groupBy === 'month' ? (it.date || '').slice(0, 7) : `${it.name} (${it.pkg})`;
      const g = groups[k] || (groups[k] = { group: k, units: 0, amounts: {} });
      g.units += it.units;
      g.amounts[u] = (g.amounts[u] || 0) + amt;
    }
  });
  const fix = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, chatRound(v)]));
  const rows = Object.values(groups).sort((a, b) => b.units - a.units).slice(0, 60).map(g => ({ ...g, amounts: fix(g.amounts) }));
  return { total_units: chatRound(total.units), total_amounts: fix(total.amounts), ...(rows.length ? { groups: rows } : {}) };
}

function toolSalesReport(a) {
  chatStatus('Reading deliveries and offers…');
  const since = chatDate(a.since), until = chatDate(a.until), mat = String(a.material || ''), proj = String(a.project || '');
  const basis = ['delivered', 'contracted', 'both'].includes(a.basis) ? a.basis : 'both';
  const groupBy = ['material', 'project', 'month', 'none'].includes(a.group_by) ? a.group_by : 'none';
  const inRange = d => (!since || d >= since) && (!until || d <= until);
  const out = { filters: { material: mat || null, project_or_client: proj || null, since: since || null, until: until || null } };
  const projOk = p => !proj || chatMatch((p?.name || '') + ' ' + (p?.client || ''), proj);
  if (basis !== 'contracted') {
    const items = [];
    let n = 0;
    Object.values(deliveries).forEach(d => {
      const p = projects[d.projectId];
      if (!inRange(d.date || '') || !projOk(p)) return;
      let hit = false;
      (d.items || []).forEach(i => {
        if (mat && !chatMatch(i.name, mat)) return;
        hit = true;
        items.push({ name: i.name, pkg: i.pkg, units: Number(i.quantity) || 0, date: d.date, project: p?.name || '—' });
      });
      if (hit) n++;
    });
    out.delivered = { note: 'physically delivered to projects, by delivery date', delivery_count: n, ...chatAggregate(items, groupBy) };
  }
  if (basis !== 'delivered') {
    const items = [];
    let n = 0;
    Object.values(projects).forEach(p => {
      if (!inRange((p.createdAt || '').slice(0, 10)) || !projOk(p)) return;
      let hit = false;
      getAllMaterials(p.systems || []).forEach(m => {
        if (mat && !chatMatch(m.name, mat)) return;
        hit = true;
        items.push({ name: m.name, pkg: m.pkg, units: m.totalUnits, date: (p.createdAt || '').slice(0, 10), project: p.name });
      });
      if (hit) n++;
    });
    out.contracted = { note: 'quantities in project offers/systems, by project creation date', project_count: n, ...chatAggregate(items, groupBy) };
  }
  const any = (out.delivered?.total_units || 0) + (out.contracted?.total_units || 0);
  if (!any && mat) {
    const names = new Set();
    Object.values(deliveries).forEach(d => (d.items || []).forEach(i => names.add(i.name)));
    Object.keys(CATALOG).forEach(s => Object.values(CATALOG[s].applications).forEach(ps => ps.forEach(p => names.add(p.name))));
    out.no_match_hint = [...names].filter(nm => chatNorm(nm).includes(chatNorm(mat).split(/\s+/)[0])).slice(0, 12);
  }
  return out;
}

function projectPayment(p) {
  const inst = p.payment?.installments || [];
  const total = p.payment?.total || inst.reduce((s, i) => s + (i.amount || 0), 0);
  const paid = inst.filter(i => i.paid).reduce((s, i) => s + (i.amount || 0), 0);
  const overdue = inst.filter(i => !i.paid && i.dueDate && i.dueDate < today());
  return { total: chatRound(total), paid: chatRound(paid), outstanding: chatRound(Math.max(0, total - paid)), overdue_installments: overdue.map(i => ({ label: i.label, amount: i.amount, due: i.dueDate })) };
}

function toolListProjects(a) {
  chatStatus('Reading projects…');
  const status = String(a.status || ''), text = String(a.text || '');
  const rows = Object.values(projects).filter(p => (!status || p.status === status) && (!text || chatMatch(`${p.name} ${p.client} ${p.location}`, text))).slice(0, 60).map(p => ({
    name: p.name, client: p.client, location: p.location, status: p.status, deadline: p.deadline || null,
    created: (p.createdAt || '').slice(0, 10), area_m2: chatRound((p.systems || []).reduce((s, x) => s + (Number(x.area) || 0), 0)),
    systems: (p.systems || []).map(s => s.systemName).join(', '), payment: projectPayment(p)
  }));
  return { count: rows.length, projects: rows };
}

function toolProjectDetails(a) {
  chatStatus('Reading project…');
  const q = String(a.name || '');
  const p = Object.values(projects).find(x => chatMatch(`${x.name} ${x.client}`, q));
  if (!p) return { error: 'No project matches "' + q + '"' };
  const dels = Object.values(deliveries).filter(d => d.projectId === p.id).sort((x, y) => (x.date || '').localeCompare(y.date || ''));
  const delivered = {};
  dels.forEach(d => (d.items || []).forEach(i => { delivered[i.material] = (delivered[i.material] || 0) + (Number(i.quantity) || 0); }));
  return {
    name: p.name, client: p.client, location: p.location, status: p.status, deadline: p.deadline || null, notes: p.notes || '',
    systems: (p.systems || []).map(s => ({ system: s.systemName, application: s.application, area_m2: s.area, from_offer: Array.isArray(s.offerItems) })),
    materials: getAllMaterials(p.systems || []).slice(0, 60).map(m => { const k = m.name + '|' + m.pkg; return { name: m.name, pkg: m.pkg, units_needed: m.totalUnits, delivered_units: delivered[k] || 0, in_stock: (stockData[k] || {}).quantity || 0 }; }),
    payment: { ...projectPayment(p), terms: p.payment?.terms || '', installments: (p.payment?.installments || []).map(i => ({ label: i.label, amount: i.amount, due: i.dueDate, paid: !!i.paid })) },
    phases: (p.phases || []).map(ph => ({ name: ph.name, status: ph.status, target_date: ph.targetDate })),
    deliveries: dels.slice(-15).map(d => ({ date: d.date, ref: d.ref, items: (d.items || []).map(i => `${i.name} (${i.pkg}) x${i.quantity}`).join('; ') })),
    production_batches: (p.production || []).length, notes_count: (p.projectNotes || []).length
  };
}

function toolListOrders(a) {
  chatStatus('Reading orders…');
  const status = String(a.status || ''), since = chatDate(a.since), mat = String(a.material || '');
  const rows = Object.values(orders).filter(o => (!status || o.status === status) && (!since || (o.createdAt || '').slice(0, 10) >= since) && (!mat || (o.items || []).some(i => chatMatch(i.name, mat))))
    .sort((x, y) => (y.createdAt || '').localeCompare(x.createdAt || '')).slice(0, 50)
    .map(o => ({ ref: o.ref, project: o.projectName || '—', status: o.status, created: (o.createdAt || '').slice(0, 10), expected: o.expectedDate || null, items: (o.items || []).map(i => `${i.name} (${i.pkg}) x${i.quantity}`).join('; ').slice(0, 300) }));
  return { count: rows.length, orders: rows };
}

function toolStockLevels(a) {
  chatStatus('Reading stock…');
  const mat = String(a.material || '');
  let rows = Object.entries(stockData).map(([k, v]) => { const [name, pkg] = k.split('|'); return { name, pkg, quantity: v.quantity, min_stock: v.minStock || 0, low: v.quantity <= (v.minStock || 0) }; })
    .filter(r => !mat || chatMatch(r.name, mat));
  if (a.only_low) rows = rows.filter(r => r.low);
  return { count: rows.length, stock: rows.slice(0, 80) };
}

function toolPayments() {
  chatStatus('Reading payments…');
  const rows = Object.values(projects).filter(p => p.payment).map(p => ({ project: p.name, client: p.client, ...projectPayment(p) }));
  const sum = k => chatRound(rows.reduce((s, r) => s + r[k], 0));
  return { projects_with_terms: rows.length, total: sum('total'), paid: sum('paid'), outstanding: sum('outstanding'), projects: rows.slice(0, 60) };
}

function chatToolDefs() {
  const str = d => ({ type: 'string', description: d });
  return [
    { name: 'sales_report', description: 'Totals of a material delivered to projects and/or contracted in offers, filtered by material name, date range and project/client; optional grouping. Returns units and kg/lt/m2 amounts. Use for "how many kg of X since date" questions.',
      inputSchema: { type: 'object', properties: { material: str('Material name words, e.g. "nanofin 50 velvet". Omit for all materials.'), since: str('Start date YYYY-MM-DD (inclusive)'), until: str('End date YYYY-MM-DD (inclusive)'), project: str('Project or client name words'), basis: { type: 'string', enum: ['delivered', 'contracted', 'both'] }, group_by: { type: 'string', enum: ['none', 'material', 'project', 'month'] } } },
      execute: toolSalesReport },
    { name: 'list_projects', description: 'List projects with client, location, status, deadline, area, systems and payment totals. Filter by status (planning, active, completed, archived) or text.',
      inputSchema: { type: 'object', properties: { status: str('planning | active | completed | archived'), text: str('Words in name, client or location') } }, execute: toolListProjects },
    { name: 'project_details', description: 'Full details of one project: systems, material requirements vs delivered vs stock, payment installments, phases, recent deliveries.',
      inputSchema: { type: 'object', properties: { name: str('Project or client name words') }, required: ['name'] }, execute: toolProjectDetails },
    { name: 'list_orders', description: 'Supplier orders (pending, ordered, received) with items, optionally filtered by status, creation date or material.',
      inputSchema: { type: 'object', properties: { status: str('pending | ordered | received'), since: str('YYYY-MM-DD'), material: str('Material name words') } }, execute: toolListOrders },
    { name: 'stock_levels', description: 'Warehouse stock per material with minimum level; can filter by material name or only low/out-of-stock items.',
      inputSchema: { type: 'object', properties: { material: str('Material name words'), only_low: { type: 'boolean' } } }, execute: toolStockLevels },
    { name: 'reorder_plan', description: 'Reorder planner result: materials to order now/soon/later with stock, minimum, remaining demand of active projects, already ordered quantity, draft orders, needed-by and order-by dates and suggested packs.', execute: toolReorderPlan },
    { name: 'erp_reconciliation', description: 'Result of the last ERP stock file comparison: counts of matching/different materials and the list of differences (ERP minus app, in packs) with last delivery/received dates.', execute: toolErpReconciliation },
    { name: 'payments_summary', description: 'Payment totals across all projects: total, paid, outstanding and overdue installments per project.', execute: toolPayments }
  ];
}

function chatDigest() {
  return {
    projects: toolListProjects({}).projects,
    stock: toolStockLevels({}).stock,
    orders: toolListOrders({}).orders,
    deliveries: Object.values(deliveries).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 120)
      .map(d => ({ date: d.date, project: projects[d.projectId]?.name, items: (d.items || []).map(i => `${i.name} (${i.pkg}) x${i.quantity}`) }))
  };
}

// ========== INIT ==========
async function init() {
  $('todayDate').textContent = fmtDate(today());

  // Try to connect capabilities
  if (window.claude) {
    try {
      db = await window.claude.use('db');
      downloads = await window.claude.use('downloads');
      assets = await window.claude.use('assets');
      room = await window.claude.use('room');
      mcp = await window.claude.use('mcp');
      sampleAI = await window.claude.use('sample');
    } catch (e) {}
  }

  if (db) {
    // Subscribe to projects
    db.collection('projects').onSnapshot(snap => {
      snap.docs.forEach(doc => { if (doc.exists) projects[doc.id] = doc.data(); });
      snap.docChanges().forEach(ch => { if (ch.type === 'removed') delete projects[ch.doc.id]; });
      markLoaded('projects');
      renderCurrentPage();
    });
    // Subscribe to stock
    db.doc('stock/materials').onSnapshot(snap => {
      if (snap.exists) stockData = snap.data();
      markLoaded('stock');
      renderCurrentPage();
    });
    // Subscribe to orders
    db.collection('orders').onSnapshot(snap => {
      snap.docs.forEach(doc => { if (doc.exists) orders[doc.id] = doc.data(); });
      snap.docChanges().forEach(ch => { if (ch.type === 'removed') delete orders[ch.doc.id]; });
      markLoaded('orders');
      renderCurrentPage();
    });
    // Subscribe to deliveries
    db.collection('deliveries').onSnapshot(snap => {
      snap.docs.forEach(doc => { if (doc.exists) deliveries[doc.id] = doc.data(); });
      snap.docChanges().forEach(ch => { if (ch.type === 'removed') delete deliveries[ch.doc.id]; });
      markLoaded('deliveries');
      renderCurrentPage();
    });
    // Subscribe to reminders
    db.collection('reminders').onSnapshot(snap => {
      snap.docs.forEach(doc => { if (doc.exists) reminders[doc.id] = doc.data(); });
      snap.docChanges().forEach(ch => { if (ch.type === 'removed') delete reminders[ch.doc.id]; });
      renderCurrentPage();
    });
    // Subscribe to planner settings
    db.doc('settings/planner').onSnapshot(snap => {
      if (snap.exists) plannerSettings = { lead: 14, includePlanning: false, leads: {}, ...snap.data() };
      if (!plannerSettings.leads) plannerSettings.leads = {};
      if (plannerOpen) renderPlanner();
    });
    // Subscribe to ERP reconciliation snapshot
    db.doc('recon/last').onSnapshot(snap => {
      if (snap.exists) recon = snap.data();
      if (reconOpen && !reconBusy) renderRecon();
    });
    // Subscribe to activity
    db.doc('activity/recent').onSnapshot(snap => {
      if (snap.exists) activities = snap.data().items || [];
      renderCurrentPage();
    });
  } else {
    // No DB - show with empty state
    renderDashboard();
  }

  // Room presence
  if (room) {
    room.presence({ name: currentUser, status: 'online' });
    room.onPeers(peers => {
      const online = Object.values(peers).filter(p => p.name);
      $('onlineCount').textContent = online.length + ' online';
    });
  }

  renderDashboard();
  initChat();
}

function renderCurrentPage() {
  const activePage = document.querySelector('.page.active');
  if (!activePage) return;
  const pageId = activePage.id.replace('page-', '');
  if (pageId === 'dashboard') renderDashboard();
  else if (pageId === 'projects') renderProjects();
  else if (pageId === 'project-detail') renderProjectDetail();
  else if (pageId === 'stock') renderStock();
  else if (pageId === 'orders') renderOrders();
  else if (pageId === 'reminders') renderReminders();
}

init();
</script>
