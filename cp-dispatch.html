function renderStock() {
  if (reconOpen) renderRecon();
  const entries = Object.entries(stockData).sort((a, b) => a[0].localeCompare(b[0]));
  if (entries.length === 0) {
    $('stockTable').innerHTML = '<div class="empty-state" style="padding:48px"><p>No stock data yet. Update your warehouse inventory to get started.</p><button class="btn btn-primary" onclick="openStockEdit()">Update Stock</button></div>';
    return;
  }
  // Calculate total demand across active projects
  const demand = {};
  Object.values(projects).filter(p => p.status === 'active').forEach(p => {
    getAllMaterials(p.systems || []).forEach(m => {
      const key = m.name + '|' + m.pkg;
      demand[key] = (demand[key] || 0) + m.totalUnits;
    });
  });

  let rows = entries.map(([key, val]) => {
    const [name, pkg] = key.split('|');
    const dem = demand[key] || 0;
    const cls = val.quantity <= 0 ? 'out' : val.quantity <= (val.minStock || 0) ? 'low' : 'ok';
    return `<tr><td><span class="stock-indicator ${cls}"></span></td><td><strong>${name}</strong></td><td>${pkg}</td><td>${val.quantity}</td><td>${val.minStock || 0}</td><td>${dem}</td><td>${val.quantity - dem}</td></tr>`;
  }).join('');
  $('stockTable').innerHTML = `<table><thead><tr><th></th><th>Material</th><th>Pkg</th><th>In Stock</th><th>Min Stock</th><th>Total Demand</th><th>Surplus/Deficit</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function openStockEdit() {
  // Collect all known materials
  const allMats = new Set();
  Object.keys(stockData).forEach(k => allMats.add(k));
  Object.values(CATALOG).forEach(sys => {
    Object.values(sys.applications).forEach(app => {
      app.forEach(prod => allMats.add(prod.name + '|' + prod.pkg));
    });
  });
  const sorted = [...allMats].sort();
  const rows = sorted.map(key => stockRowHtml(key, stockData[key] || { quantity: 0, minStock: 0 })).join('');
  const erpHtml = sampleAI ? `
    <div class="attach-zone" id="erpZone">
      <input type="file" id="erpFiles" multiple accept=".xls,.xlsx,.xlsm,.csv,.tsv,.txt,.pdf,image/jpeg,image/png,image/webp" onchange="importErpFiles(this.files)">
      <div class="az-label">📎 Upload ERP file(s)</div>
      <div class="az-sub">One or more Excel, CSV or PDF files with stock quantities — AI matches them to your materials</div>
    </div>
    <div id="erpProgress" class="scan-progress" hidden><div class="spinner"></div><span id="erpProgressText" style="flex:1">Reading…</span><button class="btn btn-secondary btn-sm" onclick="erpStop()">Stop</button></div>
    <div class="flex items-center gap-8 mb-8"><label style="margin:0;white-space:nowrap">When importing</label>
      <select id="erpMode" style="width:auto"><option value="replace">Replace quantities (ERP is correct)</option><option value="add">Add to current quantities</option></select></div>
    <div id="erpResult"></div>
    <hr style="border:none;border-top:1px solid var(--border-light);margin:12px 0">` : '';

  openModal('Update Stock', `${erpHtml}<div class="form-help mb-16">Update current warehouse quantities and minimum stock levels.</div><div id="stockRows">${rows}</div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStock()">Save Stock</button>`);
}

function saveStock() {
  const warnings = [];
  document.querySelectorAll('.stock-qty').forEach(inp => {
    const key = inp.dataset.key;
    const qty = parseInt(inp.value) || 0;
    const minEl = document.querySelector(`.stock-min[data-key="${key}"]`);
    const min = parseInt(minEl?.value) || 0;
    const oldQty = (stockData[key] || {}).quantity || 0;
    if (qty < 0) warnings.push(`${key.split('|')[0]}: negative stock`);
    if (oldQty > 0 && qty === 0) warnings.push(`${key.split('|')[0]}: zeroing out stock from ${oldQty}`);
    stockData[key] = { quantity: qty, minStock: min };
  });
  if (warnings.length > 0) {
    showWarning('Stock Update Check', warnings.join('<br>') + '<br><br>Are these values correct?', () => { if (db) db.doc('stock/materials').set(stockData); closeModal(); toast('Stock updated'); logActivity('updated warehouse stock'); renderStock(); });
    return;
  }
  if (db) db.doc('stock/materials').set(stockData);
  closeModal();
  toast('Stock updated');
  logActivity('updated warehouse stock');
  renderStock();
}

// ========== STOCK IMPORT FROM ERP FILES ==========
let erpCtl = null;
let erpUnmatched = [];

function loadScriptOnce(src, isLoaded) {
  if (isLoaded()) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load ' + src.split('/').pop()));
    document.head.appendChild(s);
  });
}

async function erpFileToText(file) {
  const name = file.name.toLowerCase();
  if (/\.(xlsx|xls|xlsm|ods)$/.test(name)) {
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', () => window.XLSX);
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    return wb.SheetNames.map(n => `# Sheet: ${n}\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false })).join('\n');
  }
  if (/\.(csv|tsv|txt)$/.test(name)) {
    const buf = await file.arrayBuffer();
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { return new TextDecoder('windows-1253').decode(buf); }
  }
  if (name.endsWith('.pdf')) return await extractPdfText(file);
  return '';
}

function erpChunks(text, max = 14000) {
  const lines = text.split('\n').filter(l => l.replace(/[\s,;|"]/g, ''));
  const head = lines.slice(0, 3).join('\n');
  const chunks = [];
  let cur = [], size = 0;
  lines.forEach(l => {
    if (size + l.length > max && cur.length) { chunks.push(cur.join('\n')); cur = []; size = 0; }
    cur.push(l); size += l.length + 1;
  });
  if (cur.length) chunks.push(cur.join('\n'));
  return chunks.map((c, i) => i === 0 ? c : head + '\n' + c);
}

function erpPrompt(known) {
  return `You are reading an inventory / stock export from the ERP of Cement Plus (microcement, Greece). It is Excel/CSV/PDF content, usually Greek. Extract the CURRENT ON-HAND STOCK quantity per product.

Known stock keys ("PRODUCT NAME|PACK SIZE"):
${known.join('\n')}

Rules:
- Use the on-hand quantity column (e.g. Υπόλοιπο, Διαθέσιμο, Απόθεμα, Stock, Qty, Ποσότητα). Never use price, value, cost, VAT or discount columns.
- One output item per product line. If the same product appears on several lines (warehouses, lots), output each line; skip "Total/Σύνολο" rows.
- "k": the EXACT known key when it is the same product AND the same pack size; if the pack size is not printed and exactly one known key has that product name, use it; otherwise null.
- "n": product name as printed. "p": pack size as printed (e.g. 20kg, 10lt) or "".
- "q": the quantity as a number. Greek number format 1.234,50 means 1234.5.
- "b": "p" if the quantity counts packs/pieces (τεμ, pcs, units, κιβώτια), "a" if it is an amount in kg, lt or m².
- Skip headers, empty lines and products clearly unrelated to microcement / construction chemicals.

Reply with ONLY this JSON: {"column":"name of the quantity column you used","items":[{"k":null,"n":"","p":"","q":0,"b":"p"}]}`;
}

function erpErrorText(e) {
  return e.code === 'not_granted' ? 'AI permission denied'
    : e.code === 'rate_limited' ? 'rate limited, try again in a moment'
    : e.code === 'invalid_json' ? 'could not read the AI reply, try a smaller or cleaner file'
    : e.code === 'prompt_too_large' ? 'file part too large'
    : (e.message || e.code || 'unknown error');
}

async function erpReadFile(file, known, progress, signal) {
  const prompt = erpPrompt(known);
  const ask = (input, extra) => sampleAI.json(input, { modelTier: 'default', cache: false, signal, ...extra });
  const items = [];
  const columns = [];
  const take = r => {
    if (r && Array.isArray(r.items)) r.items.forEach(it => items.push({ ...it, file: file.name }));
    if (r && r.column) columns.push(String(r.column));
  };
  let text = '';
  const isImage = file.type.startsWith('image/');
  if (!isImage) text = await erpFileToText(file);
  if (!isImage && text.replace(/\s/g, '').length >= 40) {
    let chunks = erpChunks(text);
    let cut = 0;
    if (chunks.length > 8) { cut = chunks.length - 8; chunks = chunks.slice(0, 8); }
    for (let i = 0; i < chunks.length; i++) {
      progress(`${file.name}: reading part ${i + 1}/${chunks.length}…`);
      take(await ask(prompt + '\n\nFILE CONTENT:\n' + chunks[i]));
    }
    if (cut) items.warning = `${file.name}: only the first 8 parts were read`;
  } else {
    const limits = await sampleAI.limits().catch(() => null);
    if (!limits?.images) throw new Error('this is a scanned file and images cannot be read in this view; export it as Excel/CSV or a text PDF');
    progress(`${file.name}: reading scanned pages…`);
    const imgs = file.type === 'application/pdf' || /\.pdf$/i.test(file.name) ? await renderPdfToImages(file) : [file];
    take(await ask(prompt + '\n\nThe stock list is in the attached image(s).', { images: imgs.slice(0, limits.images.maxCount || 5) }));
  }
  return { items, columns, warning: items.warning };
}

function erpResolveKey(it, known) {
  if (it.k && known.includes(it.k)) return it.k;
  const toks = chatNorm(it.n).replace(/[^a-z0-9α-ω.]+/g, ' ').split(/\s+/).filter(Boolean);
  if (!toks.length) return null;
  let cands = known.filter(k => { const h = chatNorm(k.split('|')[0]).replace(/[^a-z0-9α-ω.]+/g, ' '); return toks.every(t => h.includes(t)); });
  if (cands.length > 1 && it.p) { const sized = cands.filter(k => chatNorm(k.split('|')[1]) === chatNorm(it.p)); if (sized.length) cands = sized; }
  return cands.length === 1 ? cands[0] : null;
}

function stockRowHtml(key, val, note) {
  const [name, pkg] = key.split('|');
  return `<div class="form-grid stock-row${note ? ' stock-changed' : ''}" style="grid-template-columns:2fr 1fr 1fr;align-items:end;margin-bottom:6px;padding:4px 6px;border-bottom:1px solid var(--border-light)">
      <div class="text-sm"><strong>${escAttr(name)}</strong> <span class="text-muted">(${escAttr(pkg)})</span>${note ? `<div class="stock-note">${escAttr(note)}</div>` : ''}</div>
      <div><label>Qty</label><input type="number" class="stock-qty" data-key="${escAttr(key)}" value="${val.quantity}" min="0"></div>
      <div><label>Min</label><input type="number" class="stock-min" data-key="${escAttr(key)}" value="${val.minStock || 0}" min="0"></div>
    </div>`;
}

function erpStop() { if (erpCtl) erpCtl.abort(); }

async function erpReadAll(files, known, setProgress, signal) {
  const all = [], columns = [], problems = [];
  for (let i = 0; i < files.length; i++) {
    try {
      const r = await erpReadFile(files[i], known, t => setProgress(`File ${i + 1}/${files.length} — ${t}`), signal);
      all.push(...r.items); columns.push(...r.columns);
      if (r.warning) problems.push(r.warning);
    } catch (e) {
      if (e && e.code === 'cancelled') throw e;
      problems.push(`${files[i].name}: ${erpErrorText(e || {})}`);
    }
  }
  return { all, columns, problems };
}

function erpAggregate(all, known) {
  const agg = {}, unmatched = [];
  all.forEach(it => {
    const q = parseFloat(it.q);
    if (!isFinite(q) || q < 0) return;
    const key = erpResolveKey(it, known);
    const size = pkgSize(key ? key.split('|')[1] : (it.p || ''));
    const hasSize = key ? true : /(kg|lt|m²)/i.test(it.p || '');
    const isAmount = it.b === 'a';
    if (isAmount && !hasSize) { unmatched.push({ n: it.n, p: it.p || '', q: 0, raw: `${q} (amount, pack size unknown)`, file: it.file }); return; }
    const packs = Math.round(isAmount ? q / size : q);
    if (key) {
      const a = agg[key] || (agg[key] = { packs: 0, lines: 0, raw: [] });
      a.packs += packs; a.lines++;
      if (isAmount) a.raw.push(`${q} ÷ ${size}`);
    } else unmatched.push({ n: it.n, p: it.p || '', q: packs, raw: String(q), file: it.file });
  });
  return { agg, unmatched };
}

async function importErpFiles(fileList) {
  const files = [...fileList];
  const inputEl = $('erpFiles');
  if (!files.length || !sampleAI) return;
  const known = [...document.querySelectorAll('.stock-qty')].map(i => i.dataset.key);
  const mode = $('erpMode').value;
  const setProgress = t => { $('erpProgressText').textContent = t; };
  $('erpZone').hidden = true; $('erpProgress').hidden = false; $('erpResult').innerHTML = '';
  erpCtl = new AbortController();
  let res;
  try { res = await erpReadAll(files, known, setProgress, erpCtl.signal); }
  catch (e) {
    $('erpZone').hidden = false; $('erpProgress').hidden = true; inputEl.value = '';
    toast('Import cancelled', 'warn');
    return;
  }
  $('erpZone').hidden = false; $('erpProgress').hidden = true; inputEl.value = '';
  const { agg, unmatched } = erpAggregate(res.all, known);
  erpUnmatched = unmatched;

  let updated = 0;
  Object.entries(agg).forEach(([key, a]) => {
    const inp = document.querySelector(`.stock-qty[data-key="${CSS.escape(key)}"]`);
    if (!inp) return;
    const was = parseInt(inp.value) || 0;
    const next = mode === 'add' ? was + a.packs : a.packs;
    inp.value = next;
    const row = inp.closest('.stock-row');
    row.classList.add('stock-changed');
    row.querySelector('.stock-note')?.remove();
    row.firstElementChild.insertAdjacentHTML('beforeend', `<div class="stock-note">ERP: ${a.packs}${a.raw.length ? ` (${escAttr(a.raw.join(' + '))})` : ''} · was ${was}${a.lines > 1 ? ` · ${a.lines} lines summed` : ''}</div>`);
    updated++;
  });
  erpRenderResult(files.length, updated, res.columns, res.problems, mode);
  $('erpResult').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function erpRenderResult(nFiles, updated, columns, problems, mode) {
  const cols = [...new Set(columns)].join(', ');
  let html = `<div class="erp-summary"><strong>${updated} material${updated === 1 ? '' : 's'} ${mode === 'add' ? 'increased' : 'set'} from ${nFiles} file${nFiles === 1 ? '' : 's'}.</strong>
    Highlighted rows below were changed — check them, then press <strong>Save Stock</strong>.${cols ? `<div class="text-sm text-muted mt-4">Quantity column read: ${escAttr(cols)}</div>` : ''}`;
  if (problems.length) html += `<div class="chat-err text-sm mt-4">${problems.map(escAttr).join('<br>')}</div>`;
  if (erpUnmatched.length) {
    html += `<div class="mt-8"><strong>${erpUnmatched.length} line${erpUnmatched.length === 1 ? '' : 's'} not matched to a material</strong> <span class="text-sm text-muted">— add as new stock items if they are yours:</span>
      <div class="overflow-x"><table class="erp-unm"><thead><tr><th>Product</th><th>Pack</th><th>Qty (packs)</th><th></th></tr></thead><tbody>${erpUnmatched.slice(0, 40).map((u, i) => `<tr id="erpU${i}">
        <td><input type="text" class="eu-name" value="${escAttr(u.n)}" style="min-width:150px"></td>
        <td><input type="text" class="eu-pkg" value="${escAttr(u.p)}" placeholder="20kg" style="width:70px"></td>
        <td><input type="number" class="eu-qty" value="${u.q}" min="0" style="width:70px"></td>
        <td style="white-space:nowrap"><button class="btn btn-secondary btn-sm" onclick="erpAddUnmatched(${i})">Add</button> <button class="remove-btn" title="Ignore" onclick="this.closest('tr').remove()">✕</button></td></tr>`).join('')}</tbody></table></div>
      ${erpUnmatched.length > 40 ? `<div class="text-sm text-muted">Showing first 40.</div>` : ''}</div>`;
  }
  $('erpResult').innerHTML = html + '</div>';
}

function erpAddUnmatched(i) {
  const row = $('erpU' + i);
  if (!row) return;
  const name = row.querySelector('.eu-name').value.trim().replace(/\|/g, '/');
  const pkg = row.querySelector('.eu-pkg').value.trim().replace(/\|/g, '/');
  const qty = parseInt(row.querySelector('.eu-qty').value) || 0;
  if (!name || !pkg) { toast('Enter the product name and pack size (e.g. 20kg)', 'warn'); return; }
  const key = name + '|' + pkg;
  if (document.querySelector(`.stock-qty[data-key="${CSS.escape(key)}"]`)) { toast('That material already exists — it is in the list below', 'warn'); return; }
  $('stockRows').insertAdjacentHTML('afterbegin', stockRowHtml(key, { quantity: qty, minStock: 0 }, 'New from ERP file'));
  row.remove();
  toast('Added — press Save Stock to keep it');
}

let plannerSettings = { lead: 14, includePlanning: false, leads: {} };
let plannerOpen = false;
let plannerFilter = 'todo';
const PLAN_FILTERS = { todo: 'Items to order', late: 'Order now — late', soon: 'Within 7 days', later: 'Later / no date', ok: 'Covered', all: 'All materials' };
function plannerShown(all) { const f = plannerFilter; return all.filter(r => f === 'all' ? true : f === 'todo' ? r.suggest > 0 : f === 'later' ? (r.urgency === 'planned' || r.urgency === 'nodate') : r.urgency === f); }
const plannerQty = {};

const addDaysIso = (iso, n) => new Date(new Date(iso + 'T00:00:00Z').getTime() + n * 86400000).toISOString().slice(0, 10);

function nextOrderRef(prefix) {
  const y = new Date().getFullYear();
  const re = new RegExp('^' + prefix + '-' + y + '-(\\d+)$');
  const max = Object.values(orders).reduce((m, o) => { const x = re.exec(o.ref || ''); return x ? Math.max(m, +x[1]) : m; }, 0);
  return `${prefix}-${y}-${String(max + 1).padStart(3, '0')}`;
}

function materialNeedDate(p, key) {
  let best = '';
  (p.phases || []).forEach(ph => {
    if (ph.status === 'completed' || !ph.targetDate) return;
    if (getPhaseMaterials(p.systems || [], ph).some(m => m.name + '|' + m.pkg === key) && (!best || ph.targetDate < best)) best = ph.targetDate;
  });
  return best || p.deadline || '';
}

function plannerRows() {
  const statuses = plannerSettings.includePlanning ? ['active', 'planning'] : ['active'];
  const demand = {};
  Object.values(projects).filter(p => statuses.includes(p.status)).forEach(p => {
    const delivered = {};
    Object.values(deliveries).filter(d => d.projectId === p.id).forEach(d => (d.items || []).forEach(i => { delivered[i.material] = (delivered[i.material] || 0) + (Number(i.quantity) || 0); }));
    getAllMaterials(p.systems || []).forEach(m => {
      const key = m.name + '|' + m.pkg;
      const rem = Math.max(0, m.totalUnits - (delivered[key] || 0));
      if (!rem) return;
      const by = materialNeedDate(p, key);
      const d = demand[key] || (demand[key] = { total: 0, needBy: '', projects: [] });
      d.total += rem;
      d.projects.push({ project: p.name, units: rem, by });
      if (by && (!d.needBy || by < d.needBy)) d.needBy = by;
    });
  });
  const incoming = {}, drafts = {};
  Object.values(orders).forEach(o => {
    const bucket = o.status === 'ordered' ? incoming : o.status === 'pending' ? drafts : null;
    if (!bucket) return;
    (o.items || []).forEach(i => {
      const b = bucket[i.material] || (bucket[i.material] = { units: 0, orders: 0 });
      b.units += Number(i.quantity) || 0; b.orders++;
    });
  });
  const keys = new Set([...Object.keys(stockData), ...Object.keys(demand), ...Object.keys(incoming)]);
  const t = today(), soon = addDaysIso(t, 7);
  return [...keys].map(key => {
    const [name, pkg] = key.split('|');
    const st = stockData[key] || {};
    const stock = st.quantity || 0, min = st.minStock || 0;
    const dem = demand[key]?.total || 0, inc = incoming[key]?.units || 0, dr = drafts[key] || { units: 0, orders: 0 };
    const needBy = demand[key]?.needBy || '';
    const lead = plannerSettings.leads[key] != null ? plannerSettings.leads[key] : plannerSettings.lead;
    const orderBy = needBy ? addDaysIso(needBy, -lead) : '';
    const suggest = Math.max(0, dem + min - stock - inc);
    let urgency = 'ok';
    if (suggest > 0) urgency = orderBy ? (orderBy < t ? 'late' : orderBy <= soon ? 'soon' : 'planned') : 'nodate';
    return { key, name, pkg, stock, min, demand: dem, incoming: inc, draftUnits: dr.units, draftOrders: dr.orders, needBy, lead, orderBy, suggest, urgency, projects: demand[key]?.projects || [] };
  }).filter(r => r.stock || r.min || r.demand || r.incoming)
    .sort((a, b) => ({ late: 0, soon: 1, nodate: 2, planned: 3, ok: 4 }[a.urgency] - { late: 0, soon: 1, nodate: 2, planned: 3, ok: 4 }[b.urgency]) || (a.orderBy || '9').localeCompare(b.orderBy || '9') || a.name.localeCompare(b.name));
}

const PLAN_STATUS = { late: ['chip-red', 'Order now — late'], soon: ['chip-amber', 'Order within 7 days'], planned: ['chip-blue', 'Planned'], nodate: ['chip-gray', 'No needed-by date'], ok: ['chip-green', 'Covered'] };
const planQty = r => plannerQty[r.key] != null ? plannerQty[r.key] : r.suggest;

function applyPlannerVisibility() {
  if (!$('plannerView')) return;
  $('ordersMain').hidden = plannerOpen;
  $('plannerView').hidden = !plannerOpen;
  $('ordersTitle').textContent = plannerOpen ? 'Reorder Planner' : 'Orders';
  $('plannerBackBtn').hidden = !plannerOpen;
  $('plannerBtn').hidden = plannerOpen;
  $('newOrderBtn').hidden = plannerOpen;
}
function openPlanner() { plannerOpen = true; applyPlannerVisibility(); renderPlanner(); }
function closePlannerView() { plannerOpen = false; applyPlannerVisibility(); }

function savePlannerSettings() {
  if (!db) return;
  try { const r = db.doc('settings/planner').set(JSON.parse(JSON.stringify(plannerSettings))); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
function plannerSetDefaultLead(v) { plannerSettings.lead = Math.max(0, parseInt(v) || 0); savePlannerSettings(); renderPlanner(); }
function plannerSetInclude(v) { plannerSettings.includePlanning = !!v; savePlannerSettings(); renderPlanner(); }
function plannerSetLead(key, v) {
  if (v === '' || v == null) delete plannerSettings.leads[key]; else plannerSettings.leads[key] = Math.max(0, parseInt(v) || 0);
  savePlannerSettings(); renderPlanner();
}
function plannerQtyChange(el) { plannerQty[el.dataset.key] = Math.max(0, parseInt(el.value) || 0); }

function renderPlanner() {
  const el = $('plannerView');
  if (!el) return;
  const all = plannerRows();
  const todo = all.filter(r => r.suggest > 0);
  const cnt = u => all.filter(r => r.urgency === u).length;
  const totalPacks = todo.reduce((s, r) => s + planQty(r), 0);
  const shown = plannerShown(all);
  const fmt = d => d ? fmtDate(d) : '—';
  const rows = shown.map(r => {
    const [cls, label] = PLAN_STATUS[r.urgency];
    const why = r.projects.map(p => `${p.project}: ${p.units}${p.by ? ' by ' + fmtDate(p.by) : ''}`).join('\n');
    return `<tr>
      <td>${r.suggest > 0 ? `<input type="checkbox" class="list-check chk-plan" value="${escAttr(r.key)}" onchange="updateBatchBar('chk-plan','batchPlan');updateToggleLabel('chk-plan','togPlan')">` : ''}</td>
      <td><strong>${escAttr(r.name)}</strong></td><td>${escAttr(r.pkg)}</td>
      <td>${r.stock}</td><td>${r.min}</td>
      <td title="${escAttr(why)}" style="cursor:${why ? 'help' : 'default'}">${r.demand}</td>
      <td>${r.incoming || '—'}</td>
      <td>${r.draftUnits ? `<span class="chip chip-gray" title="${r.draftOrders} draft order(s) not yet placed">${r.draftUnits} draft</span>` : '—'}</td>
      <td style="white-space:nowrap">${fmt(r.needBy)}</td>
      <td><input type="number" min="0" value="${plannerSettings.leads[r.key] != null ? plannerSettings.leads[r.key] : ''}" placeholder="${plannerSettings.lead}" style="width:64px;padding:5px 7px;font-size:.8rem" onchange="plannerSetLead(${JSON.stringify(r.key).replace(/"/g, '&quot;')},this.value)"></td>
      <td style="white-space:nowrap">${fmt(r.orderBy)}</td>
      <td>${r.suggest > 0 ? `<input type="number" class="plan-qty" data-key="${escAttr(r.key)}" min="0" value="${planQty(r)}" style="width:72px;padding:5px 7px;font-size:.8rem;font-weight:600" onchange="plannerQtyChange(this)">` : '—'}</td>
      <td style="white-space:nowrap"><span class="chip ${cls}">${label}</span></td></tr>`;
  }).join('');
  el.innerHTML = `
    <div class="card mb-16"><div class="card-body">
      <div class="text-sm text-muted mb-8">For each material: <strong>suggested order = remaining demand of active projects + minimum stock − stock − already ordered</strong>. "Order by" = needed-by date − lead time. Needed-by is the earliest phase target date that uses the material, otherwise the project deadline. Hover the demand number to see which projects need it.</div>
      <div class="flex items-center gap-8" style="flex-wrap:wrap">
        <label style="margin:0;text-transform:none;letter-spacing:0;font-size:.85rem;display:flex;align-items:center;gap:6px">Default lead time <input type="number" min="0" value="${plannerSettings.lead}" style="width:70px" onchange="plannerSetDefaultLead(this.value)"> days</label>
        <label style="margin:0;text-transform:none;letter-spacing:0;font-size:.85rem;display:flex;align-items:center;gap:6px"><input type="checkbox" class="list-check" ${plannerSettings.includePlanning ? 'checked' : ''} onchange="plannerSetInclude(this.checked)"> Include projects in "planning"</label>
        <span style="flex:1"></span>
        <button class="btn btn-secondary btn-sm" onclick="plannerExport()">Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="plannerOrderUrgent()">Order all late + soon</button>
      </div>
    </div></div>
    <div class="pay-kpis">
      <div class="pay-kpi tile-link ${plannerFilter === 'late' ? 'active' : ''}" role="button" tabindex="0" onclick="plannerFilter='late';renderPlanner()"><div class="pk-val" style="color:var(--red)">${cnt('late')}</div><div class="pk-label">Order now — late</div></div>
      <div class="pay-kpi tile-link ${plannerFilter === 'soon' ? 'active' : ''}" role="button" tabindex="0" onclick="plannerFilter='soon';renderPlanner()"><div class="pk-val" style="color:var(--amber)">${cnt('soon')}</div><div class="pk-label">Within 7 days</div></div>
      <div class="pay-kpi tile-link ${plannerFilter === 'later' ? 'active' : ''}" role="button" tabindex="0" onclick="plannerFilter='later';renderPlanner()"><div class="pk-val">${cnt('planned') + cnt('nodate')}</div><div class="pk-label">Later / no date</div></div>
      <div class="pay-kpi tile-link ${plannerFilter === 'ok' ? 'active' : ''}" role="button" tabindex="0" onclick="plannerFilter='ok';renderPlanner()"><div class="pk-val" style="color:var(--green)">${cnt('ok')}</div><div class="pk-label">Covered</div></div>
      <div class="pay-kpi tile-link ${plannerFilter === 'todo' ? 'active' : ''}" role="button" tabindex="0" onclick="plannerFilter='todo';renderPlanner()"><div class="pk-val">${totalPacks}</div><div class="pk-label">Packs to order</div></div>
    </div>
    <div class="card"><div class="card-body no-pad overflow-x">
      <div class="flex items-center gap-8" style="padding:12px 16px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;font-size:.85rem"><input type="checkbox" class="list-check" ${plannerFilter === 'todo' ? 'checked' : ''} onchange="plannerFilter=this.checked?'todo':'all';renderPlanner()"> Only items to order (${todo.length})</label>
        ${plannerFilter !== 'todo' && plannerFilter !== 'all' ? `<span class="chip chip-blue">Showing: ${PLAN_FILTERS[plannerFilter]}</span>` : ''}
        ${todo.length ? `<button class="select-toggle" id="togPlan" onclick="selectAllToggle('chk-plan','batchPlan','togPlan')">Select All</button>` : ''}
      </div>
      <div style="padding:0 16px">${batchBar('batchPlan')}</div>
      ${shown.length ? `<table><thead><tr><th style="width:36px">${todo.length ? `<input type="checkbox" class="list-check" onchange="toggleAll('chk-plan',this);updateToggleLabel('chk-plan','togPlan')">` : ''}</th><th>Material</th><th>Pack</th><th>Stock</th><th>Min</th><th>Demand</th><th>Ordered</th><th>Drafts</th><th>Needed by</th><th>Lead (d)</th><th>Order by</th><th>Suggest</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty-state" style="padding:32px"><p>${all.length ? 'Everything is covered — nothing to order.' : 'No stock or project demand yet.'}</p></div>`}
    </div></div>
    <div class="form-help mt-8">"Drafts" are pending orders not yet placed with a supplier; they are not counted as incoming, so check them before creating another order.</div>`;
}

function plannerKeysFor(keys) { return plannerRows().filter(r => keys.includes(r.key) && planQty(r) > 0); }

function batchPlannerOrder() { openPlannerOrder(selIds('chk-plan')); }
function plannerOrderUrgent() {
  const keys = plannerRows().filter(r => r.urgency === 'late' || r.urgency === 'soon').map(r => r.key);
  if (!keys.length) { toast('Nothing is late or due within 7 days', 'warn'); return; }
  openPlannerOrder(keys);
}

function openPlannerOrder(keys) {
  const rows = plannerKeysFor(keys);
  if (!rows.length) { toast('Select items with a quantity to order', 'warn'); return; }
  const dr = rows.filter(r => r.draftOrders > 0).length;
  openModal(`Create Order — ${rows.length} item${rows.length === 1 ? '' : 's'}`, `
    ${dr ? `<div class="chat-err text-sm mb-8">${dr} of these already ${dr === 1 ? 'has' : 'have'} a draft order. Delete the old draft if this replaces it.</div>` : ''}
    <div class="overflow-x"><table><thead><tr><th>Material</th><th>Pack</th><th>Packs</th></tr></thead><tbody>${rows.map(r => `<tr><td>${escAttr(r.name)}</td><td>${escAttr(r.pkg)}</td><td>${planQty(r)}</td></tr>`).join('')}</tbody></table></div>
    <div class="form-grid mt-16"><div class="form-row"><label>Expected delivery (optional)</label><input type="date" id="poExpected"></div>
    <div class="form-row"><label>Supplier / notes</label><input type="text" id="poNotes" placeholder="e.g., Supplier, reference"></div></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createPlannerOrder(${JSON.stringify(rows.map(r => r.key)).replace(/"/g, '&quot;')})">Create Order</button>`);
}

function createPlannerOrder(keys) {
  const rows = plannerKeysFor(keys);
  if (!rows.length) return;
  const id = 'ord_' + uid();
  const order = {
    id, ref: nextOrderRef('ORD'), projectId: '', projectName: 'Reorder planner', status: 'pending',
    items: rows.map(r => ({ material: r.key, name: r.name, pkg: r.pkg, quantity: planQty(r) })),
    createdAt: new Date().toISOString(), createdBy: currentUser,
    expectedDate: $('poExpected')?.value || '',
    notes: ($('poNotes')?.value?.trim() ? $('poNotes').value.trim() + ' — ' : '') + 'Created from Reorder Planner'
  };
  orders[id] = order;
  if (db) db.doc('orders/' + id).set(order);
  rows.forEach(r => { delete plannerQty[r.key]; });
  logActivity(`created order ${order.ref} from reorder planner (${rows.length} items)`);
  closeModal();
  toast(`Order ${order.ref} created with ${rows.length} items`);
  renderPlanner();
}

function plannerExport() {
  const rows = plannerShown(plannerRows());
  saveCsv('reorder-plan.csv', [['Material', 'Pack', 'Stock', 'Min', 'Demand', 'Ordered', 'Drafts', 'Needed by', 'Lead days', 'Order by', 'Suggested packs', 'Status']]
    .concat(rows.map(r => [r.name, r.pkg, r.stock, r.min, r.demand, r.incoming, r.draftUnits, r.needBy, r.lead, r.orderBy, planQty(r), PLAN_STATUS[r.urgency][1]])));
}

function batchPlannerExport() {
  const sel = selIds('chk-plan');
  saveCsv('reorder-plan.csv', [['Material', 'Pack', 'Stock', 'Demand', 'Order by', 'Suggested packs']]
    .concat(plannerRows().filter(r => sel.includes(r.key)).map(r => [r.name, r.pkg, r.stock, r.demand, r.orderBy, planQty(r)])));
}

function toolReorderPlan() {
  chatStatus('Reading reorder plan…');
  const rows = plannerRows(), todo = rows.filter(r => r.suggest > 0);
  return {
    unit: 'packs', default_lead_days: plannerSettings.lead, includes_planning_projects: plannerSettings.includePlanning,
    counts: { late: rows.filter(r => r.urgency === 'late').length, soon: rows.filter(r => r.urgency === 'soon').length, later_or_no_date: rows.filter(r => r.urgency === 'planned' || r.urgency === 'nodate').length, covered: rows.filter(r => r.urgency === 'ok').length },
    to_order: todo.slice(0, 60).map(r => ({ material: r.name, pack: r.pkg, stock: r.stock, min: r.min, demand: r.demand, ordered: r.incoming, draft_units: r.draftUnits, needed_by: r.needBy || null, order_by: r.orderBy || null, suggest: r.suggest, status: PLAN_STATUS[r.urgency][1], for_projects: r.projects.map(p => p.project).join(', ') }))
  };
}

// ========== RECONCILE WITH ERP ==========
let recon = null;
let reconOpen = false;
let reconFilter = 'diff';
const RECON_FILTERS = { diff: 'Differences', match: 'Match', erphigher: 'ERP higher', apphigher: 'App higher', notinfile: 'Not in file', all: 'All' };
function reconShown(all) { const f = reconFilter; return all.filter(r => f === 'all' ? true : f === 'diff' ? (r.status === 'erphigher' || r.status === 'apphigher') : r.status === f); }
let reconBusy = false;
let reconMsg = '';
let reconCtl = null;

function allMaterialKeys() {
  const keys = new Set(Object.keys(stockData));
  Object.values(CATALOG).forEach(sys => Object.values(sys.applications).forEach(ps => ps.forEach(p => keys.add(p.name + '|' + p.pkg))));
  return [...keys];
}

function applyReconVisibility() {
  if (!$('reconView')) return;
  $('stockMain').hidden = reconOpen;
  $('reconView').hidden = !reconOpen;
  $('stockTitle').textContent = reconOpen ? 'Reconcile with ERP' : 'Warehouse Stock';
  $('reconBackBtn').hidden = !reconOpen;
  $('reconBtn').hidden = reconOpen;
  $('stockEditBtn').hidden = reconOpen;
}
function openReconcile() { reconOpen = true; applyReconVisibility(); renderRecon(); }
function closeReconcileView() { reconOpen = false; applyReconVisibility(); }

function reconRowsData() {
  const erpMap = {};
  (recon?.erp || []).forEach(e => { erpMap[e.k] = e; });
  const lastDel = {}, lastRec = {};
  Object.values(deliveries).forEach(d => (d.items || []).forEach(i => { if (d.date && d.date > (lastDel[i.material] || '')) lastDel[i.material] = d.date; }));
  Object.values(orders).filter(o => o.status === 'received').forEach(o => (o.items || []).forEach(i => { const dt = (o.receivedAt || '').slice(0, 10); if (dt > (lastRec[i.material] || '')) lastRec[i.material] = dt; }));
  const keys = new Set([...Object.keys(stockData), ...Object.keys(erpMap)]);
  const rank = { erphigher: 0, apphigher: 0, notinfile: 1, match: 2 };
  return [...keys].map(key => {
    const [name, pkg] = key.split('|');
    const app = (stockData[key] || {}).quantity || 0;
    const e = erpMap[key];
    const diff = e ? e.packs - app : null;
    const status = !e ? 'notinfile' : diff === 0 ? 'match' : diff > 0 ? 'erphigher' : 'apphigher';
    return { key, name, pkg, app, erp: e ? e.packs : null, diff, status, raw: e?.raw || '', lines: e?.lines || 0, lastDel: lastDel[key] || '', lastRec: lastRec[key] || '' };
  }).filter(r => !(r.status === 'notinfile' && r.app === 0))
    .sort((a, b) => rank[a.status] - rank[b.status] || Math.abs(b.diff || 0) - Math.abs(a.diff || 0) || a.name.localeCompare(b.name));
}

const RECON_STATUS = {
  match: ['chip-green', 'Match'], erphigher: ['chip-amber', 'ERP higher'], apphigher: ['chip-red', 'App higher'], notinfile: ['chip-gray', 'Not in file']
};

function reconUploadHtml(label) {
  return `<div class="attach-zone" id="reconZone" ${reconBusy ? 'hidden' : ''}>
      <input type="file" id="reconFiles" multiple accept=".xls,.xlsx,.xlsm,.csv,.tsv,.txt,.pdf,image/jpeg,image/png,image/webp" onchange="reconUpload(this.files)">
      <div class="az-label">📎 ${label}</div>
      <div class="az-sub">Excel, CSV or PDF stock export from your ERP. Select all files at once — nothing is changed in the app until you choose to.</div>
    </div>
    <div id="reconProgress" class="scan-progress" ${reconBusy ? '' : 'hidden'}><div class="spinner"></div><span id="reconProgressText" style="flex:1">${escAttr(reconMsg)}</span><button class="btn btn-secondary btn-sm" onclick="reconStop()">Stop</button></div>`;
}

function renderRecon() {
  const el = $('reconView');
  if (!el) return;
  if (!sampleAI) { el.innerHTML = '<div class="card"><div class="card-body"><div class="empty-state"><p>AI file reading is not available in this view.</p></div></div></div>'; return; }
  if (!recon) {
    el.innerHTML = `<div class="card"><div class="card-body">${reconUploadHtml('Upload ERP stock file(s) to compare')}
      <div class="form-help">Compares the quantities in your ERP with the warehouse stock in this app and lists every difference, with the last delivery and last received order to help find the cause.</div></div></div>`;
    return;
  }
  const all = reconRowsData();
  const cnt = s => all.filter(r => r.status === s).length;
  const net = all.reduce((s, r) => s + (r.diff || 0), 0);
  const shown = reconShown(all);
  const diffRows = all.filter(r => r.status === 'erphigher' || r.status === 'apphigher').length;
  const rows = shown.map(r => {
    const [cls, label] = RECON_STATUS[r.status];
    const isDiff = r.status === 'erphigher' || r.status === 'apphigher';
    const move = [r.lastDel ? 'Delivery ' + fmtDate(r.lastDel) : '', r.lastRec ? 'Received ' + fmtDate(r.lastRec) : ''].filter(Boolean).join(' · ') || '—';
    return `<tr>
      <td>${isDiff ? `<input type="checkbox" class="list-check chk-rec" value="${escAttr(r.key)}" onchange="updateBatchBar('chk-rec','batchRec');updateToggleLabel('chk-rec','togRec')">` : ''}</td>
      <td><strong>${escAttr(r.name)}</strong></td><td>${escAttr(r.pkg)}</td>
      <td>${r.app}</td><td style="white-space:nowrap">${r.erp === null ? '—' : r.erp}${r.raw ? `<div class="stock-note">${escAttr(r.raw)}</div>` : ''}${r.lines > 1 ? `<div class="stock-note">${r.lines} lines</div>` : ''}</td>
      <td style="font-weight:600;color:${r.diff > 0 ? 'var(--amber)' : r.diff < 0 ? 'var(--red)' : 'var(--ink-3)'}">${r.diff === null ? '—' : (r.diff > 0 ? '+' : '') + r.diff}</td>
      <td style="white-space:nowrap"><span class="chip ${cls}">${label}</span></td>
      <td class="text-sm text-muted">${move}</td>
      <td>${isDiff ? `<button class="btn btn-secondary btn-sm" onclick="reconApply([${JSON.stringify(r.key).replace(/"/g, '&quot;')}])">Use ERP</button>` : ''}</td></tr>`;
  }).join('');
  const unm = (recon.unmatched || []);
  el.innerHTML = `
    <div class="card mb-16"><div class="card-body">
      <div class="flex justify-between items-center mb-8" style="flex-wrap:wrap;gap:8px">
        <div class="text-sm text-muted">ERP snapshot: <strong>${(recon.files || []).map(escAttr).join(', ')}</strong> · ${fmtDate(recon.at)} by ${escAttr(recon.by || '')}${recon.column ? ' · quantity column: ' + escAttr(recon.column) : ''}</div>
        <button class="btn btn-secondary btn-sm" onclick="reconExport()">Export report</button>
      </div>
      <div class="text-sm text-muted mb-8">The ERP numbers are fixed at upload; the app numbers are live, so rows turn to "Match" as you apply ERP values or record deliveries.</div>
      ${reconUploadHtml('Upload newer ERP file(s) — replaces this comparison')}
      ${(recon.problems || []).length ? `<div class="chat-err text-sm mb-8">${recon.problems.map(escAttr).join('<br>')}</div>` : ''}
    </div></div>
    <div class="pay-kpis">

      <div class="pay-kpi tile-link ${reconFilter === 'diff' ? 'active' : ''}" role="button" tabindex="0" onclick="reconFilter='diff';renderRecon()"><div class="pk-val">${net > 0 ? '+' : ''}${net}</div><div class="pk-label">Net difference (packs)</div></div>

}

function reconStop() { if (reconCtl) reconCtl.abort(); }

async function reconUpload(fileList) {
  const files = [...fileList];
  if (!files.length || !sampleAI || reconBusy) return;
  const known = allMaterialKeys();
  reconBusy = true; reconMsg = 'Preparing…'; reconCtl = new AbortController();
  renderRecon();
  const progress = t => { reconMsg = t; if ($('reconProgressText')) $('reconProgressText').textContent = t; };
  let res;
  try { res = await erpReadAll(files, known, progress, reconCtl.signal); }
  catch (e) { reconBusy = false; renderRecon(); toast('Comparison cancelled', 'warn'); return; }
  reconBusy = false;
  const { agg, unmatched } = erpAggregate(res.all, known);
  recon = {
    at: new Date().toISOString(), by: currentUser, files: files.map(f => f.name),
    column: [...new Set(res.columns)].join(', '),
    erp: Object.entries(agg).map(([k, a]) => ({ k, packs: a.packs, lines: a.lines, raw: a.raw.join(' + ') })),
    unmatched: unmatched.slice(0, 100), problems: res.problems
  };
  saveRecon();
  logActivity(`compared stock with ERP file(s): ${recon.files.join(', ')}`);
  reconFilter = 'diff';
  renderRecon();
  toast(recon.erp.length ? `${recon.erp.length} materials compared` : 'No materials could be read from the file(s)', recon.erp.length ? undefined : 'warn');
}

function saveRecon() {
  if (!db || !recon) return;
  try {
    const r = db.doc('recon/last').set(JSON.parse(JSON.stringify(recon)));
    if (r && r.catch) r.catch(() => {});
  } catch (e) {}
}

function reconApply(keys) {
  let n = 0;
  keys.forEach(k => {
    const e = (recon?.erp || []).find(x => x.k === k);
    if (!e) return;
    stockData[k] = { quantity: e.packs, minStock: (stockData[k] || {}).minStock || 0 };
    n++;
  });
  if (!n) return;
  if (db) db.doc('stock/materials').set(stockData);
  logActivity(`set ${n} stock quantit${n === 1 ? 'y' : 'ies'} to ERP values (reconciliation)`);
  toast(`${n} stock quantit${n === 1 ? 'y' : 'ies'} set to ERP`);
  renderRecon();
}

function batchReconApply() {
  const keys = selIds('chk-rec');
  if (!keys.length) return;
  showWarning(`Use ERP quantities for ${keys.length} material${keys.length === 1 ? '' : 's'}`, 'Overwrite the app stock of the selected materials with the ERP numbers?', () => reconApply(keys));
}

function reconExport(onlySelected) {
  const sel = onlySelected ? selIds('chk-rec') : null;
  const rows = reconRowsData().filter(r => sel ? sel.includes(r.key) : true).filter(r => sel ? true : reconShown([r]).length > 0);
  saveCsv('erp-reconciliation.csv', [['Material', 'Pack', 'App stock', 'ERP', 'Difference (ERP - app)', 'Status', 'Last delivery', 'Last received']]
    .concat(rows.map(r => [r.name, r.pkg, r.app, r.erp === null ? '' : r.erp, r.diff === null ? '' : r.diff, RECON_STATUS[r.status][1], r.lastDel, r.lastRec])));
}

function reconAddUnmatched(i) {
  const row = $('recU' + i);
  if (!row) return;
  const name = row.querySelector('.eu-name').value.trim().replace(/\|/g, '/');
  const pkg = row.querySelector('.eu-pkg').value.trim().replace(/\|/g, '/');
  const qty = parseInt(row.querySelector('.eu-qty').value) || 0;
  if (!name || !pkg) { toast('Enter the product name and pack size (e.g. 20kg)', 'warn'); return; }
  const key = name + '|' + pkg;
  if (stockData[key]) { toast('That material already exists in stock', 'warn'); return; }
  stockData[key] = { quantity: qty, minStock: 0 };
  recon.erp.push({ k: key, packs: qty, lines: 1, raw: '' });
  recon.unmatched.splice(i, 1);
  if (db) db.doc('stock/materials').set(stockData);
  saveRecon();
  logActivity(`added "${name}" (${pkg}) to stock from ERP file`);
  toast('Added to stock');
  renderRecon();
}

function reconIgnoreUnmatched(i) {
  recon.unmatched.splice(i, 1);
  saveRecon();
  renderRecon();
}

function toolErpReconciliation() {
  chatStatus('Reading ERP reconciliation…');
  if (!recon) return { available: false, note: 'No ERP file has been uploaded for reconciliation yet (Stock page > Reconcile with ERP).' };
  const rows = reconRowsData();
  const diffs = rows.filter(r => r.status === 'erphigher' || r.status === 'apphigher');
  return {
    available: true, files: recon.files, uploaded: recon.at, by: recon.by, unit: 'packs',
    counts: { match: rows.filter(r => r.status === 'match').length, erp_higher: rows.filter(r => r.status === 'erphigher').length, app_higher: rows.filter(r => r.status === 'apphigher').length, not_in_file: rows.filter(r => r.status === 'notinfile').length },
    differences: diffs.slice(0, 60).map(r => ({ material: r.name, pack: r.pkg, app: r.app, erp: r.erp, diff_erp_minus_app: r.diff, last_delivery: r.lastDel || null, last_received: r.lastRec || null })),
    unmatched_erp_lines: (recon.unmatched || []).length
  };
}

// ========== ORDERS ==========
function renderOrders() {
  if (plannerOpen) renderPlanner();
  const ordArr = Object.values(orders).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  if (ordArr.length === 0) {
    $('ordersList').innerHTML = '<div class="empty-state" style="padding:48px"><p>No orders yet. Orders are generated automatically from project material needs.</p></div>';
    return;
  }
  const statusChip = s => ({ pending: 'chip-amber', ordered: 'chip-blue', received: 'chip-green', cancelled: 'chip-gray' }[s] || 'chip-gray');
  let rows = ordArr.map(o => {
    const itemCount = (o.items || []).reduce((s, i) => s + (i.quantity || 0), 0);
    return `<tr>
      <td><input type="checkbox" class="list-check chk-ord" value="${o.id}" onchange="updateBatchBar('chk-ord','batchOrd');updateToggleLabel('chk-ord','togOrd')"></td>
      <td><strong>${o.ref || o.id}</strong></td>
      <td>${o.projectName || '—'}</td>
      <td><span class="chip ${statusChip(o.status)}">${o.status}</span></td>
      <td>${itemCount} units</td>
      <td>${fmtDate(o.createdAt)}</td>
      <td>${fmtDate(o.expectedDate)}</td>
      <td>
        ${o.status === 'pending' ? `<button class="btn btn-secondary btn-sm" onclick="markOrdered('${o.id}')">Mark Ordered</button>` : ''}
        ${o.status === 'ordered' ? `<button class="btn btn-primary btn-sm" onclick="receiveOrder('${o.id}')">Receive</button>` : ''}
        <button class="btn btn-secondary btn-sm" onclick="viewOrder('${o.id}')">View</button>
        ${o.status === 'pending' ? `<button class="btn btn-secondary btn-sm" onclick="editOrder('${o.id}')">Edit</button>` : ''}
        ${o.status !== 'received' ? `<button class="remove-btn" onclick="deleteOrder('${o.id}')" title="Delete order">✕</button>` : ''}
      </td>
    </tr>`;

    ${batchBar('batchOrd')}
    <table><thead><tr><th style="width:36px"><input type="checkbox" class="list-check" onchange="toggleAll('chk-ord',this);updateToggleLabel('chk-ord','togOrd')"></th><th>Reference</th><th>Project</th><th>Status</th><th>Items</th><th>Created</th><th>Expected</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function openNewOrder() {
  const allMats = new Set();
  Object.values(CATALOG).forEach(sys => Object.values(sys.applications).forEach(app => app.forEach(prod => allMats.add(prod.name + '|' + prod.pkg))));
  Object.keys(stockData).forEach(k => allMats.add(k));
  const sorted = [...allMats].sort();
  const rows = sorted.map(key => {
    const [name, pkg] = key.split('|');
    return `<div class="form-grid" style="grid-template-columns:2fr 1fr;align-items:end;margin-bottom:6px"><div class="text-sm"><strong>${name}</strong> (${pkg})</div><div><input type="number" class="order-qty" data-mat="${key}" value="0" min="0"></div></div>`;
  }).join('');
  const projOpts = Object.values(projects).map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  openModal('New Order', `
    <div class="form-grid"><div class="form-row"><label>Order Reference</label><input type="text" id="ordRef" value="ORD-${new Date().getFullYear()}-${String(Object.keys(orders).length + 1).padStart(3, '0')}"></div>
    <div class="form-row"><label>Related Project</label><select id="ordProject"><option value="">None</option>${projOpts}</select></div></div>
    <div class="form-row"><label>Expected Delivery Date</label><input type="date" id="ordExpected"></div>
    <div class="form-row"><label>Notes</label><textarea id="ordNotes" rows="2"></textarea></div>
    <hr style="border:none;border-top:1px solid var(--border-light);margin:16px 0"><h3 class="mb-8">Materials to Order</h3>${rows}
  `, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewOrder()">Create Order</button>`);
}

function saveNewOrder() {
  const items = [];
  document.querySelectorAll('.order-qty').forEach(inp => {
    const qty = parseInt(inp.value) || 0;
    if (qty > 0) {
      const sKey = inp.dataset.mat;
      items.push({ material: sKey, name: sKey.split('|')[0], pkg: sKey.split('|')[1], quantity: qty });
    }
  });
  if (items.length === 0) { toast('No materials selected', 'warn'); return; }
  const id = 'ord_' + uid();
  const projId = $('ordProject').value;
  orders[id] = {
    id, ref: $('ordRef').value.trim(), projectId: projId,
    projectName: projId ? projects[projId]?.name : '', status: 'pending',
    items, createdAt: new Date().toISOString(), createdBy: currentUser,
    expectedDate: $('ordExpected').value, notes: $('ordNotes').value.trim()
  };
  if (db) db.doc('orders/' + id).set(orders[id]);
  logActivity(`created order ${orders[id].ref}`);
  closeModal();
  toast('Order created');
  renderOrders();
}

function markOrdered(ordId) {
  const o = orders[ordId];
  if (!o) return;
  const expDate = prompt('Expected delivery date (YYYY-MM-DD):', o.expectedDate || '');
  o.status = 'ordered';
  if (expDate) o.expectedDate = expDate;
  o.orderedAt = new Date().toISOString();
  if (db) db.doc('orders/' + ordId).set(o);
  logActivity(`marked order ${o.ref} as ordered`);
  toast('Order marked as ordered');
  renderOrders();
}

function receiveOrder(ordId) {
  const o = orders[ordId];
  if (!o) return;
  o.status = 'received';
  o.receivedAt = new Date().toISOString();
  // Add to stock
  (o.items || []).forEach(item => {
    if (!stockData[item.material]) stockData[item.material] = { quantity: 0, minStock: 0 };
    stockData[item.material].quantity += item.quantity;
  });
  if (db) {
    db.doc('orders/' + ordId).set(o);
    db.doc('stock/materials').set(stockData);
  }
  logActivity(`received order ${o.ref} (${(o.items || []).length} items added to stock)`);
  toast('Order received and stock updated');
  renderOrders();
}

function viewOrder(ordId) {
  const o = orders[ordId];
  if (!o) return;
  openModal('Order ' + (o.ref || ordId), `
    <div class="form-grid mb-16"><div><label>Reference</label><p>${o.ref}</p></div><div><label>Status</label><p>${o.status}</p></div></div>
    <div class="form-grid mb-16"><div><label>Project</label><p>${o.projectName || '—'}</p></div><div><label>Expected</label><p>${fmtDate(o.expectedDate)}</p></div></div>
    <table><thead><tr><th>Material</th><th>Pkg</th><th>Quantity</th></tr></thead><tbody>${(o.items || []).map(i => `<tr><td>${i.name}</td><td>${i.pkg}</td><td>${i.quantity}</td></tr>`).join('')}</tbody></table>
    ${o.notes ? `<div class="mt-16"><label>Notes</label><p>${o.notes}</p></div>` : ''}
  `, `<button class="btn btn-secondary" onclick="closeModal()">Close</button>`);
}

function editOrder(ordId) {
  const o = orders[ordId];
  if (!o || o.status !== 'pending') { toast('Only pending orders can be edited', 'warn'); return; }
  const allMats = new Set();
  Object.values(CATALOG).forEach(sys => Object.values(sys.applications).forEach(app => app.forEach(prod => allMats.add(prod.name + '|' + prod.pkg))));
  Object.keys(stockData).forEach(k => allMats.add(k));
  const sorted = [...allMats].sort();
  const existingQty = {};
  (o.items || []).forEach(i => { existingQty[i.material] = i.quantity; });
  const rows = sorted.map(key => {
    const [name, pkg] = key.split('|');
    return `<div class="form-grid" style="grid-template-columns:2fr 1fr;align-items:end;margin-bottom:6px"><div class="text-sm"><strong>${name}</strong> (${pkg})</div><div><input type="number" class="order-qty" data-mat="${key}" value="${existingQty[key] || 0}" min="0"></div></div>`;
  }).join('');
  const projOpts = Object.values(projects).map(p => `<option value="${p.id}" ${p.id === o.projectId ? 'selected' : ''}>${p.name}</option>`).join('');
  openModal('Edit Order', `
    <div class="form-grid"><div class="form-row"><label>Order Reference</label><input type="text" id="ordRef" value="${escAttr(o.ref)}"></div>
    <div class="form-row"><label>Related Project</label><select id="ordProject"><option value="">None</option>${projOpts}</select></div></div>
    <div class="form-row"><label>Expected Delivery Date</label><input type="date" id="ordExpected" value="${o.expectedDate || ''}"></div>
    <div class="form-row"><label>Notes</label><textarea id="ordNotes" rows="2">${escAttr(o.notes || '')}</textarea></div>
    <hr style="border:none;border-top:1px solid var(--border-light);margin:16px 0"><h3 class="mb-8">Materials to Order</h3>${rows}
  `, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditOrder('${ordId}')">Save Changes</button>`);
}

function saveEditOrder(ordId) {
  const o = orders[ordId];
  if (!o) return;
  const items = [];
  document.querySelectorAll('.order-qty').forEach(inp => {
    const qty = parseInt(inp.value) || 0;
    if (qty > 0) {
      const sKey = inp.dataset.mat;
      items.push({ material: sKey, name: sKey.split('|')[0], pkg: sKey.split('|')[1], quantity: qty });
    }
  });
  if (items.length === 0) { toast('No materials selected', 'warn'); return; }
  const projId = $('ordProject').value;
  Object.assign(o, {
    ref: $('ordRef').value.trim(),
    projectId: projId,
    projectName: projId ? projects[projId]?.name : '',
    items,
    expectedDate: $('ordExpected').value,
    notes: $('ordNotes').value.trim(),
    updatedAt: new Date().toISOString()
  });
  if (db) db.doc('orders/' + ordId).set(o);
  logActivity(`updated order ${o.ref}`);
  closeModal();
  toast('Order updated');
  renderOrders();
}

function deleteOrder(ordId) {
  const o = orders[ordId];
  if (!o) return;
  showWarning('Delete Order', `Delete order "${o.ref || ordId}"? This cannot be undone.`, () => {
    delete orders[ordId];
    if (db) db.doc('orders/' + ordId).delete();
    logActivity(`deleted order ${o.ref || ordId}`);
    toast('Order deleted');
    renderOrders();
  });
}

// ========== REMINDERS ==========
function renderReminders() {
  const remArr = Object.values(reminders).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const active = remArr.filter(r => !r.done);
  const done = remArr.filter(r => r.done);
  let html = '';
  if (active.length === 0 && done.length === 0) {
    html = '<div class="empty-state"><p>No reminders set. Create a reminder to keep your team on track.</p></div>';
  } else {
    if (active.length > 0) {
      html += '<h3 class="mb-8">Active</h3>';
      html += `<div class="flex items-center gap-8 mb-8"><button class="select-toggle" id="togRem" onclick="selectAllToggle('chk-rem','batchRem','togRem')">Select All</button></div>`;
      html += batchBar('batchRem');
      active.forEach(r => {
        const days = r.date ? daysDiff(r.date, new Date()) : null;
        const urgent = days !== null && days <= 0;
        html += `<div class="reminder-item" style="${urgent ? 'border-color:var(--red)' : ''}">
          <input type="checkbox" class="list-check chk-rem" value="${r.id}" onchange="updateBatchBar('chk-rem','batchRem');updateToggleLabel('chk-rem','togRem')" style="margin-top:2px">
          <div style="flex:1"><div class="rem-msg">${r.message}</div><div class="rem-date">${r.date ? fmtDate(r.date) + (r.time ? ' at ' + r.time : '') : 'No date'} • For: ${(r.assignees || []).join(', ') || 'All'} ${urgent ? ' • <strong style="color:var(--red)">DUE</strong>' : ''}</div></div>
          <div class="rem-actions"><button class="btn btn-secondary btn-sm" onclick="editReminder('${r.id}')">Edit</button><button class="btn btn-secondary btn-sm" onclick="completeReminder('${r.id}')">Done</button><button class="remove-btn" onclick="deleteReminder('${r.id}')">✕</button></div>
        </div>`;
      });
    }
    if (done.length > 0) {
      html += '<h3 class="mb-8 mt-16" style="color:var(--ink-3)">Completed</h3>';
      done.slice(0, 10).forEach(r => {
        html += `<div class="reminder-item" style="opacity:.6"><div style="flex:1"><div class="rem-msg" style="text-decoration:line-through">${r.message}</div><div class="rem-date">${fmtDate(r.date)}</div></div></div>`;
      });
    }
  }
  $('remindersList').innerHTML = html;
}

function openNewReminder() {
  const teamChecks = TEAM.map(t => `<label style="display:flex;align-items:center;gap:6px;font-size:.875rem;text-transform:none;letter-spacing:0"><input type="checkbox" class="rem-assignee" value="${t.name}" checked> ${t.name}</label>`).join('');
  openModal('New Reminder', `
    <div class="form-row"><label>Message</label><textarea id="remMsg" rows="2" placeholder="e.g., Check if order has shipped"></textarea></div>
    <div class="form-grid"><div class="form-row"><label>Date</label><input type="date" id="remDate" value="${today()}"></div>
    <div class="form-row"><label>Time</label><input type="time" id="remTime" value="09:00"></div></div>
    <div class="form-row"><label>Assign To</label><div class="flex gap-8 flex-wrap">${teamChecks}</div></div>
    <div class="form-row"><label>Related Project</label><select id="remProject"><option value="">None</option>${Object.values(projects).map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
  `, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveReminder()">Create Reminder</button>`);
}

function saveReminder() {
  const msg = $('remMsg').value.trim();
  if (!msg) { toast('Reminder message is required', 'error'); return; }
  const assignees = [];
  document.querySelectorAll('.rem-assignee:checked').forEach(cb => assignees.push(cb.value));
  const id = 'rem_' + uid();
  reminders[id] = {
    id, message: msg, date: $('remDate').value, time: $('remTime').value,
    assignees, projectId: $('remProject').value, done: false,
    createdAt: new Date().toISOString(), createdBy: currentUser
  };
  if (db) db.doc('reminders/' + id).set(reminders[id]);
  logActivity(`set reminder: "${msg}"`);
  closeModal();
  toast('Reminder created');
  renderReminders();
}

function completeReminder(id) {
  if (reminders[id]) {
    reminders[id].done = true;

function saveMaterialOverrides(sysIdx) {
  const p = projects[currentProject];
  const sys = p.systems[sysIdx];
  const catDef = CATALOG[sys.systemName];
  const defaultProducts = catDef ? catDef.applications[sys.application] || [] : [];
  const rows = $('matOverrideRows').querySelectorAll('.inline-edit-row');
  const overrides = {};
  const extraProducts = [];

  rows.forEach(row => {
    const idx = parseInt(row.dataset.idx);
    const isCustom = row.dataset.custom === 'true';
    const name = row.querySelector('.ov-name').value.trim();
    const pkg = row.querySelector('.ov-pkg').value.trim();
    const consumption = parseFloat(row.querySelector('.ov-consumption').value) || 0;
    const unit = row.querySelector('.ov-unit').value.trim() || 'kg';
    if (!name) return;

    if (isCustom || idx >= defaultProducts.length) {
      extraProducts.push({ name, pkg, consumption, unit });
    } else {
      const def = defaultProducts[idx];
      const ov = {};
      if (name !== def.name) ov.name = name;
      if (pkg !== def.pkg) ov.pkg = pkg;
      if (consumption !== def.consumption) ov.consumption = consumption;
      if (unit !== def.unit) ov.unit = unit;
      if (Object.keys(ov).length > 0) overrides[idx] = ov;
    }
  });

  sys.materialOverrides = Object.keys(overrides).length > 0 ? overrides : undefined;
  sys.extraProducts = extraProducts.length > 0 ? extraProducts : undefined;
  p.updatedAt = new Date().toISOString();
  if (db) db.doc('projects/' + p.id).set(p);
  logActivity(`edited materials for ${sys.systemName} in "${p.name}"`);
  closeModal();
  toast('Material overrides saved');
  renderProjectDetail();
}

function resetMaterialOverrides(sysIdx) {
  const p = projects[currentProject];
  const sys = p.systems[sysIdx];
  delete sys.materialOverrides;
  delete sys.extraProducts;
  p.updatedAt = new Date().toISOString();
  if (db) db.doc('projects/' + p.id).set(p);
  closeModal();
  toast('Reset to catalog defaults');
  renderProjectDetail();
}

// ========== GANTT TIMELINE ==========
function renderTimeline() {
  const prjs = Object.values(projects).filter(p => (p.status==='active'||p.status==='planning') && (p.phases||[]).length > 0);
  if (prjs.length === 0) {
    $('timelineContent').innerHTML = '<div class="empty-state"><p>No active projects with phases to show on the timeline.</p></div>';
    return;
  }
  let earliest = new Date(), latest = new Date();
  latest.setMonth(latest.getMonth() + 2);
  prjs.forEach(p => {
    const created = new Date(p.createdAt || Date.now());
    if (created < earliest) earliest = created;
    (p.phases||[]).forEach(ph => { if (ph.targetDate) { const d = new Date(ph.targetDate); if (d > latest) latest = new Date(d.getTime()+7*864e5); }});
    if (p.deadline) { const d = new Date(p.deadline); if (d > latest) latest = new Date(d.getTime()+7*864e5); }
  });
  earliest = new Date(earliest.getTime() - 7*864e5);
  const totalDays = Math.max(30, daysDiff(latest, earliest));
  const dayW = Math.max(3, Math.min(16, 700 / totalDays));
  const chartW = totalDays * dayW;
  let months = '';
  const cur = new Date(earliest); cur.setDate(1);
  while (cur <= latest) {
    const ms = Math.max(0, daysDiff(cur, earliest));
    const next = new Date(cur); next.setMonth(next.getMonth()+1);
    const me = Math.min(daysDiff(next, earliest), totalDays);
    const w = (me - ms) * dayW;
    if (w > 0) months += `<div class="gantt-mlabel" style="width:${w}px">${cur.toLocaleDateString('en-GB',{month:'short',year:'2-digit'})}</div>`;
    cur.setTime(next.getTime());
  }
  const todayX = daysDiff(new Date(), earliest) * dayW;
  let rows = '';
  prjs.forEach(p => {
    const created = new Date(p.createdAt || Date.now());
    rows += `<div class="gantt-row" style="background:var(--surface-alt)"><div class="gantt-label"><strong style="cursor:pointer" onclick="navigate('project-detail','${p.id}')">${p.name}</strong></div><div class="gantt-bars" style="width:${chartW}px">${p.deadline?`<div style="position:absolute;left:${daysDiff(new Date(p.deadline),earliest)*dayW}px;top:0;bottom:0;width:2px;background:var(--red);opacity:.4" title="Deadline ${fmtDate(p.deadline)}"></div>`:''}</div></div>`;
    const phases = p.phases || [];
    const phCount = phases.length;
    const projSpan = p.deadline ? daysDiff(new Date(p.deadline), created) : totalDays * 0.6;
    phases.forEach((ph, i) => {
      let startDay, endDay;
      if (ph.targetDate) {
        endDay = daysDiff(new Date(ph.targetDate), earliest);
        const dur = Math.max(7, projSpan / phCount);
        startDay = endDay - dur;
      } else {
        const dur = projSpan / phCount;
        startDay = daysDiff(created, earliest) + dur * i;
        endDay = startDay + dur;
      }
      startDay = Math.max(0, startDay);
      const barL = startDay * dayW;
      const barW = Math.max(30, (endDay - startDay) * dayW);
      rows += `<div class="gantt-row"><div class="gantt-label" style="padding-left:20px;font-size:.78rem;color:var(--ink-2)">${ph.name}</div><div class="gantt-bars" style="width:${chartW}px"><div class="gantt-bar ${ph.status}" onclick="navigate('project-detail','${p.id}');goTab('phases')" style="cursor:pointer;left:${barL}px;width:${barW}px" title="${ph.name} — ${(ph.status||'pending').replace('_',' ')}">${ph.name}</div></div></div>`;
    });
  });
  $('timelineContent').innerHTML = `<div class="gantt-wrap"><div class="gantt-head"><div class="gantt-label">Project / Phase</div><div class="gantt-months" style="width:${chartW}px">${months}</div></div><div style="position:relative">${rows}<div style="position:absolute;top:0;bottom:0;left:${180+todayX}px;width:2px;background:var(--blue);opacity:.4;z-index:1;pointer-events:none" title="Today"></div></div></div><div class="flex items-center gap-8 mt-8 text-sm text-muted"><span style="display:inline-block;width:12px;height:3px;background:var(--blue);border-radius:2px"></span> Today <span style="display:inline-block;width:12px;height:3px;background:var(--red);border-radius:2px;margin-left:12px"></span> Deadline</div>`;
}

// ========== AUTO-REORDER ENGINE ==========
const dataLoaded = { projects: false, stock: false, orders: false, deliveries: false };
let autoReorderChecked = false;
function appDataReady() { return !db || Object.values(dataLoaded).every(Boolean); }
function markLoaded(name) {
  dataLoaded[name] = true;
  if (!autoReorderChecked && appDataReady()) { autoReorderChecked = true; checkAutoReorder(); }
}

function checkAutoReorder() {
  if (!appDataReady()) return;
  const toReorder = plannerRows()
    .filter(r => r.suggest > 0 && (r.urgency === 'late' || r.urgency === 'soon' || r.stock <= r.min) && r.draftOrders === 0)
    .map(r => ({ material: r.key, name: r.name, pkg: r.pkg, quantity: r.suggest }));
  if (toReorder.length === 0) return;
  const todayStr = today();
  const alreadyToday = Object.values(orders).some(o => o.autoGenerated && o.createdAt && o.createdAt.startsWith(todayStr));
  if (alreadyToday) return;
  const orderId = 'ord_' + uid();
  const order = {
    id: orderId,
    ref: nextOrderRef('AUTO'),
    projectId: '', projectName: 'Auto-reorder', status: 'pending',
    items: toReorder, createdAt: new Date().toISOString(), createdBy: 'System',
    autoGenerated: true, expectedDate: '',
    notes: 'Auto-generated from the reorder planner: stock below minimum or order-by date reached (' + toReorder.length + ' items)'
  };
  orders[orderId] = order;
  if (db) db.doc('orders/' + orderId).set(order);
  logActivity(`auto-reorder ${order.ref} created (${toReorder.length} items)`);
  toast(`Auto-reorder ${order.ref}: ${toReorder.length} items`, 'warn');
}

async function sendTeamEmail(subject, body) {
  if (!mcp) { toast('Email not available — connect Gmail in claude.ai Settings', 'warn'); return false; }
  try {
    await mcp.callTool('Gmail', 'send_message', {
      to: TEAM.map(t => t.email),
      subject: '[Cement Plus Daily] ' + subject,
      body: body + '\n\n—\nCement Plus Daily'
    });
    toast('Email sent to team');
    return true;
  } catch (e) {
    if (e.code === 'not_granted' || e.code === 'server_not_connected' || e.code === 'not_in_manifest') {
      toast('Gmail not connected — add Gmail in claude.ai Settings → Connectors', 'warn');
    } else {
      toast('Email failed: ' + (e.message || 'Unknown error'), 'error');
    }
    return false;
  }
}

function notifyLowStock() {
  const low = Object.entries(stockData).filter(([k,v]) => v.quantity > 0 && v.quantity <= (v.minStock||0));
  const out = Object.entries(stockData).filter(([k,v]) => v.quantity <= 0);
  if (low.length === 0 && out.length === 0) { toast('No stock alerts to send'); return; }
  let body = 'Stock Alert\n';
  if (out.length) body += '\nOUT OF STOCK:\n' + out.map(([k]) => '  - ' + k.replace('|', ' ')).join('\n');
  if (low.length) body += '\nLOW STOCK:\n' + low.map(([k,v]) => '  - ' + k.replace('|', ' ') + ': ' + v.quantity + ' remaining (min: ' + v.minStock + ')').join('\n');
  sendTeamEmail('Stock Alert — ' + (out.length + low.length) + ' items need attention', body);
}

function drawBarChart(id, labels, data, token) {
  const canvas = $(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const pad = {t:12,r:10,b:26,l:36};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  const s = getComputedStyle(document.documentElement);
  const color = s.getPropertyValue(token).trim()||'#F05A1E';
  const ink = s.getPropertyValue('--ink').trim()||'#333';
  const brd = s.getPropertyValue('--border-light').trim()||'#eee';
  const step = Math.max(1, Math.ceil(Math.max(...data, 1) / 3));
  const maxVal = step * 3;
  const bw = cw/labels.length*0.55;
  ctx.textBaseline = 'middle';
  for (let i=0;i<=3;i++){
    const y=pad.t+ch-ch*i/3;
    ctx.strokeStyle=brd;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    ctx.fillStyle=ink;ctx.font='10px IBM Plex Sans,sans-serif';ctx.textAlign='right';ctx.fillText(step*i,pad.l-4,y);
  }
  labels.forEach((lbl,i)=>{
    const x=pad.l+cw/labels.length*i+(cw/labels.length-bw)/2;
    const bh=Math.max(2,data[i]/maxVal*ch); const y=pad.t+ch-bh;
    ctx.fillStyle=color;ctx.beginPath();
    const r=Math.min(3,bw/4);
    ctx.moveTo(x+r,y);ctx.lineTo(x+bw-r,y);ctx.quadraticCurveTo(x+bw,y,x+bw,y+r);
    ctx.lineTo(x+bw,pad.t+ch);ctx.lineTo(x,pad.t+ch);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.fill();
    if(data[i]>0){ctx.fillStyle=ink;ctx.font='bold 10px Archivo,sans-serif';ctx.textAlign='center';ctx.fillText(data[i],x+bw/2,y-7);}
    ctx.fillStyle=ink;ctx.font='10px IBM Plex Sans,sans-serif';ctx.textAlign='center';ctx.fillText(lbl,x+bw/2,pad.t+ch+14);
  });
}

For EACH line item, extract:

async function renderPdfToImages(file) {
  if (!window.pdfjsLib) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const data = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data }).promise;
  const imgs = [];
  const max = Math.min(pdf.numPages, 5);
  for (let i = 1; i <= max; i++) {
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale: 2 });
    const c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (blob) imgs.push(blob);
  }
  return imgs;
}

async function extractPdfText(file) {
  if (!window.pdfjsLib) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const data = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(item => item.str).join(' ') + '\n';
  }
  return text;
}

function confirmImportMaterials() {
  const p = projects[currentProject];
  if (!p) return;
  const rows = document.querySelectorAll('#importItemsBody .import-row');
  const items = [];
  rows.forEach(row => {
    if (!row.querySelector('.import-check')?.checked) return;
    const name = row.querySelector('.import-name')?.value?.trim();
    const pkg = row.querySelector('.import-pkg')?.value?.trim() || '1kg';
    const qty = parseInt(row.querySelector('.import-qty')?.value) || 1;
    const unit = row.querySelector('.import-unit')?.value?.trim() || 'kg';
    if (!name) return;
    items.push({ name, pkg, qty, unit });
  });
  if (items.length === 0) { toast('No materials selected', 'warn'); return; }
  const targetVal = $('importTargetSystem')?.value;
  let sys;
  if (targetVal === 'new') {
    const docType = $('importDocType')?.value || 'offer';
    sys = { id: uid(), systemName: (docType === 'invoice' ? 'Invoice' : 'Offer') + ' Import', application: 'Imported materials', area: 1, notes: 'Imported on ' + fmtDate(today()), offerItems: [] };
    if (!p.systems) p.systems = [];
    p.systems.push(sys);
  } else {
    sys = p.systems[parseInt(targetVal)];
    if (!sys) { toast('System not found', 'error'); return; }
  }
  if (Array.isArray(sys.offerItems)) {
    items.forEach(item => sys.offerItems.push({ name: item.name, pkg: item.pkg, quantity: item.qty, unit: item.unit }));
  } else {
    if (!sys.extraProducts) sys.extraProducts = [];
    items.forEach(item => {
      const totalQty = item.qty * pkgSize(item.pkg);
      sys.extraProducts.push({ name: item.name, pkg: item.pkg, consumption: totalQty / sys.area, unit: item.unit });
    });
  }
  p.updatedAt = new Date().toISOString();
  if (db) db.doc('projects/' + p.id).set(p);
  logActivity(`imported ${items.length} materials from offer/invoice into "${p.name}"`);
  closeModal();
  toast(`${items.length} materials imported successfully`);
  renderProjectDetail();
}
